name: Railway Token Scope Diagnostic

# READ-ONLY diagnostic — runs on this PR only, never merged to main as a
# permanent workflow. Prints which project/environment/services the
# RAILWAY_TOKEN / RAILWAY_API_TOKEN secrets can actually reach, and which
# token TYPE each one is. No deploys, no writes.
#
# Railway token types:
#   - PROJECT token → env var RAILWAY_TOKEN, bound to one project+env;
#     `railway whoami` fails by design, `railway variables` works without
#     --environment (bound env is implicit).
#   - ACCOUNT/workspace token → env var RAILWAY_API_TOKEN; `railway whoami`
#     works, service probes need --environment.
# A token stored under the WRONG var name reports "Invalid RAILWAY_TOKEN"
# on every call — exactly what the last diagnostic run showed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose RAILWAY_TOKEN scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report which secrets are present
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN: present" || echo "RAILWAY_TOKEN: EMPTY"
          [ -n "$RAILWAY_API_TOKEN" ] && echo "RAILWAY_API_TOKEN: present" || echo "RAILWAY_API_TOKEN: empty"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Probe RAILWAY_TOKEN (project-token semantics)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          echo "=== whoami ==="; railway whoami || true
          echo "=== status (authoritative service list) ==="
          # railway status prints the real service names — DO NOT trust
          # `variables --service X` to prove a service exists: it returns
          # environment-level vars even when X resolves to nothing
          # (observed: `--service web` "worked" while no web service exists;
          # the staging web app is @litlabs/litt-shell).
          railway status || true
          echo "=== variables service=@litlabs/litt-shell ==="
          railway variables --service "@litlabs/litt-shell" 2>&1 | head -10 || true

      - name: Probe RAILWAY_API_TOKEN (account-token semantics)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        continue-on-error: true
        run: |
          echo "=== whoami (works only for account tokens) ==="
          railway whoami || true
          echo "=== variables service=@litlabs/litt-shell --environment staging ==="
          railway variables --service "@litlabs/litt-shell" --environment staging 2>&1 | head -10 || true

      - name: Cross-check — is RAILWAY_TOKEN actually an account token?
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          # If the value stored as RAILWAY_TOKEN is really an account token,
          # it will authenticate when passed via RAILWAY_API_TOKEN instead.
          echo "=== RAILWAY_TOKEN value probed AS RAILWAY_API_TOKEN ==="
          railway whoami || true
