name: Railway Token Scope Diagnostic

# READ-ONLY diagnostic — runs on this PR only, never merged to main as a
# permanent workflow. Prints which project/environment/services the
# RAILWAY_TOKEN secret can actually reach. No deploys, no writes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose RAILWAY_TOKEN scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check RAILWAY_TOKEN present
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is empty"
            exit 1
          fi
          echo "token present (value masked)"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Railway account/whoami
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: railway whoami || true

      - name: Railway status (linked project/env/service)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: railway status || true

      - name: Probe WITHOUT --environment (project tokens are env-bound)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          # Project tokens are bound to ONE environment — passing a different
          # --environment makes them look invalid even when valid. Probe the
          # bound env implicitly, then each candidate service name.
          echo "=== variables (no env, service=web) ==="
          railway variables --service web 2>&1 | head -30 || true
          echo "=== variables (no env, service=litlabslitt-shell-staging) ==="
          railway variables --service litlabslitt-shell-staging 2>&1 | head -30 || true
          echo "=== variables (no env, service=litlabs-terminal-server) ==="
          railway variables --service litlabs-terminal-server 2>&1 | head -30 || true

      - name: Probe WITH --environment staging (account-token style)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          railway variables --service web --environment staging 2>&1 | head -30 || true
