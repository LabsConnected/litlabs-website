name: Deploy to Railway Staging

# Manual-dispatch ONLY. Deploys a chosen commit SHA to the Railway STAGING
# service for the web app — NEVER production. A requested commit can be
# exercised on staging without changing the production service.
#
# Safety: project, environment, and service IDs are pinned, and token scope
# is verified before any Railway write.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (full 40-char hex) to deploy to staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-web-deploy
  cancel-in-progress: false

env:
  # The Railway SERVICE name — neither the domain subdomain NOR the app's
  # /api/health service label is the service name. `railway status` in the
  # staging environment lists the web app as @litlabs/litt-shell (serving
  # litlabslitt-shell-staging.up.railway.app); there is no "web" service —
  # deploying with it 404s on code upload.
  STAGING_SERVICE: "@litlabs/litt-shell"
  STAGING_PROJECT_ID: 3d5b8abe-088c-4a6c-9b34-7054829247c9
  STAGING_ENVIRONMENT_ID: 8631ff55-0835-449b-942e-a9c3748dea98
  STAGING_SERVICE_ID: 0fbedda0-0053-481c-9e4f-a3ea8100eb16
  STAGING_ENVIRONMENT: staging
  STAGING_URL: https://litlabslitt-shell-staging.up.railway.app

jobs:
  deploy-staging:
    name: Deploy SHA to Railway staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate SHA input
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-char lowercase hex commit SHA"
            exit 1
          fi

      - name: Guard — staging-only target
        run: |
          # Both the service and environment are hardcoded to staging values.
          # Refuse anything that smells like a production identifier.
          for target in "$STAGING_SERVICE" "$STAGING_ENVIRONMENT"; do
            case "$target" in
              *production*|*prod*|litlabs-terminal-server|*terminal*)
                echo "::error::refusing to deploy — target resolves to production ($target)"
                exit 1
                ;;
            esac
          done
          echo "Deploy target: service=$STAGING_SERVICE env=$STAGING_ENVIRONMENT (staging only)"

      - name: Check Railway credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          # Either a project token (RAILWAY_TOKEN) or an account token
          # (RAILWAY_API_TOKEN) satisfies the deploy. Refuse only when
          # BOTH are absent — and say exactly which secret to set.
          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::No Railway credential — set RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account token)."
            exit 1
          fi

      - name: Checkout at requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Verify Railway token scope and staging target
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$RAILWAY_TOKEN" ]; then
            scope="$(railway api 'query { projectToken { projectId environmentId } }' --compact)"
            if ! printf '%s' "$scope" | jq -e \
              --arg project "$STAGING_PROJECT_ID" \
              --arg environment "$STAGING_ENVIRONMENT_ID" \
              '.data.projectToken.projectId == $project and .data.projectToken.environmentId == $environment' \
              > /dev/null; then
              echo "::error::Railway project token is not bound to the approved staging project and environment"
              exit 1
            fi
            status="$(railway status --json)"
          else
            status="$(railway status --project "$STAGING_PROJECT_ID" \
              --environment "$STAGING_ENVIRONMENT_ID" --json)"
          fi
          if ! printf '%s' "$status" | jq -e \
            --arg project "$STAGING_PROJECT_ID" \
            --arg environment "$STAGING_ENVIRONMENT_ID" \
            --arg service "$STAGING_SERVICE_ID" \
            '.id == $project and any(.environments.edges[]?.node;
              .id == $environment and any(.serviceInstances.edges[]?.node;
                .serviceId == $service and .serviceName == "@litlabs/litt-shell"))' \
            > /dev/null; then
            echo "::error::Railway target does not match the approved staging web service"
            exit 1
          fi
          echo "Verified Railway staging project, environment, and web service IDs"

      - name: Deploy to staging service only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # railway up (CLI upload) does NOT inject RAILWAY_GIT_COMMIT_SHA —
          # only Railway's own GitHub integration does. Without it the built
          # app reports a stale/ancient commit on /api/health (observed:
          # upload of the candidate served correctly but reported eaeefc52,
          # a months-old stored value). Set it explicitly with --skip-deploys
          # so the upload below is the deployment that picks it up — same
          # pattern as deploy-terminal.yml.
          # --service pins the deploy to the STAGING web service only.
          # A project token (RAILWAY_TOKEN) is already bound to one
          # environment — passing --environment alongside it resolves a
          # second env context and the upload endpoint 404s. An account
          # token (RAILWAY_API_TOKEN) is not env-bound, so it needs
          # --environment to select staging.
          if [ -n "$RAILWAY_TOKEN" ]; then
            railway variable set "RAILWAY_GIT_COMMIT_SHA=$INPUT_SHA" \
              --service "$STAGING_SERVICE_ID" --skip-deploys
            railway up --service "$STAGING_SERVICE_ID" --detach
          else
            railway variable set "RAILWAY_GIT_COMMIT_SHA=$INPUT_SHA" \
              --project "$STAGING_PROJECT_ID" \
              --environment "$STAGING_ENVIRONMENT_ID" \
              --service "$STAGING_SERVICE_ID" --skip-deploys
            railway up --project "$STAGING_PROJECT_ID" \
              --environment "$STAGING_ENVIRONMENT_ID" \
              --service "$STAGING_SERVICE_ID" --detach
          fi

      - name: Verify staging health + deployed SHA
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          # A Railway build of this app takes 5-15 min after `railway up`
          # uploads — and may be queued behind the env's auto-deploy of
          # main. Poll for ~20 min total before declaring a SHA mismatch.
          sleep 60
          for i in $(seq 1 76); do
            body="$(curl -fsS --max-time 20 \
              -A 'Mozilla/5.0 (compatible; staging-deploy-check)' \
              "$STAGING_URL/api/health" || true)"
            detail="$(printf '%s' "$body" | jq -r '.checks.build.detail // ""' 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // ""' 2>/dev/null || true)"
            echo "poll $i: status=$status build=$detail"
            if [ "$status" = "ok" ] && [ "$detail" = "$EXPECTED_SHA" ]; then
              echo "STAGING_DEPLOY_VERIFIED sha=$EXPECTED_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::staging did not report expected SHA $EXPECTED_SHA"
          exit 1
