name: Deploy to Railway Staging

# Manual-dispatch ONLY. Deploys a chosen commit SHA to the Railway STAGING
# service for the web app — NEVER production. Production auto-deploys via
# Railway's own GitHub integration on main merges; this workflow exists so a
# non-main commit can be exercised on staging WITHOUT touching production.
#
# Safety: the target service is HARDCODED to the staging web service — there
# is no input that can redirect this workflow at the production service, and
# a guard step rejects any name that is not the staging service.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (full 40-char hex) to deploy to staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-web-deploy
  cancel-in-progress: false

env:
  # The Railway SERVICE name — the domain subdomain is NOT the service name
  # (terminal's service is litlabs-terminal-server vs domain …-production-0be1).
  # The staging web service reports service:"web" on /api/health.
  STAGING_SERVICE: web
  STAGING_ENVIRONMENT: staging
  STAGING_URL: https://litlabslitt-shell-staging.up.railway.app

jobs:
  deploy-staging:
    name: Deploy SHA to Railway staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate SHA input
        run: |
          if ! [[ "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-char lowercase hex commit SHA"
            exit 1
          fi

      - name: Guard — staging-only target
        run: |
          # Both the service and environment are hardcoded to staging values.
          # Refuse anything that smells like a production identifier.
          for target in "$STAGING_SERVICE" "$STAGING_ENVIRONMENT"; do
            case "$target" in
              *production*|*prod*|litlabs-terminal-server|*terminal*)
                echo "::error::refusing to deploy — target resolves to production ($target)"
                exit 1
                ;;
            esac
          done
          echo "Deploy target: service=$STAGING_SERVICE env=$STAGING_ENVIRONMENT (staging only)"

      - name: Check Railway credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          # Either a project token (RAILWAY_TOKEN) or an account token
          # (RAILWAY_API_TOKEN) satisfies the deploy. Refuse only when
          # BOTH are absent — and say exactly which secret to set.
          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::No Railway credential — set RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account token)."
            exit 1
          fi

      - name: Checkout at requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Diagnose Railway token scope
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        continue-on-error: true
        run: |
          # Prints the project/environment/service the token can actually
          # see — no secret values. If the token is project-scoped to a
          # different project/environment the deploy step's failure is
          # explained by this output.
          railway status || true

      - name: Deploy to staging service only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          # --service pins the deploy to the STAGING web service only.
          # A project token (RAILWAY_TOKEN) is already bound to one
          # environment — passing --environment alongside it resolves a
          # second env context and the upload endpoint 404s. An account
          # token (RAILWAY_API_TOKEN) is not env-bound, so it needs
          # --environment to select staging.
          if [ -n "$RAILWAY_TOKEN" ]; then
            railway up --service "$STAGING_SERVICE" --detach
          else
            railway up --service "$STAGING_SERVICE" --environment "$STAGING_ENVIRONMENT" --detach
          fi

      - name: Verify staging health + deployed SHA
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          sleep 60
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 \
              -A 'Mozilla/5.0 (compatible; staging-deploy-check)' \
              "$STAGING_URL/api/health" || true)"
            detail="$(printf '%s' "$body" | jq -r '.checks.build.detail // ""' 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // ""' 2>/dev/null || true)"
            echo "poll $i: status=$status build=$detail"
            if [ "$status" = "ok" ] && [ "$detail" = "$EXPECTED_SHA" ]; then
              echo "STAGING_DEPLOY_VERIFIED sha=$EXPECTED_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::staging did not report expected SHA $EXPECTED_SHA"
          exit 1
