name: Deploy to Railway Staging

# Manual-dispatch ONLY. Deploys a chosen commit SHA to the Railway STAGING
# service for the web app — never production. Production auto-deploys via
# Railway's own GitHub integration on main merges; this workflow exists so a
# non-main commit can be exercised on staging WITHOUT touching production.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (full 40-char hex) to deploy to staging"
        required: true
        type: string
      service:
        description: "Railway service name for the staging web app"
        required: true
        default: "litlabslitt-shell-staging"
        type: string

permissions:
  contents: read

concurrency:
  group: staging-web-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy SHA to Railway staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate SHA input
        run: |
          if ! [[ "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-char lowercase hex commit SHA"
            exit 1
          fi

      - name: Check RAILWAY_TOKEN
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN GitHub secret is not set — cannot deploy."
            exit 1
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"

      - name: Checkout at requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Install Railway CLI
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to staging service only
        if: steps.check_token.outputs.has_token == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # --service pins the deploy to the STAGING web service only.
          # There is deliberately no path here to the production service.
          railway up --service "${{ inputs.service }}" --detach

      - name: Verify staging health + deployed SHA
        if: steps.check_token.outputs.has_token == 'true'
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          sleep 60
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 \
              -A 'Mozilla/5.0 (compatible; staging-deploy-check)' \
              https://litlabslitt-shell-staging.up.railway.app/api/health || true)"
            detail="$(printf '%s' "$body" | jq -r '.checks.build.detail // ""' 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // ""' 2>/dev/null || true)"
            echo "poll $i: status=$status build=$detail"
            if [ "$status" = "ok" ] && [ "$detail" = "$EXPECTED_SHA" ]; then
              echo "STAGING_DEPLOY_VERIFIED sha=$EXPECTED_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::staging did not report expected SHA $EXPECTED_SHA"
          exit 1
