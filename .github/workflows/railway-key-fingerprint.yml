name: Railway Key Fingerprint Diagnostic

# READ-ONLY diagnostic (manual dispatch only). Compares the
# TERMINAL_INTERNAL_SERVICE_KEY configured on the staging web service
# (@litlabs/litt-shell) against the one on the staging terminal-server
# service — by length + SHA-256 fingerprint ONLY. Secret values are never
# printed. Also prints non-secret URL variables and the service inventory.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare terminal service-key fingerprints (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Service inventory
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway status || true
          railway status --json 2>/dev/null | head -100 || true

      - name: Fingerprint TERMINAL_INTERNAL_SERVICE_KEY per service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -u
          python3 scripts/ci/railway-var-fingerprint.py --all-services
          for svc in "@litlabs/litt-shell" "terminal-server"; do
            echo "=== service: $svc ==="
            python3 scripts/ci/railway-var-fingerprint.py "$svc" \
              TERMINAL_INTERNAL_SERVICE_KEY INTERNAL_SERVICE_KEY TERMINAL_AUTH_SECRET
          done

      - name: Verdict
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -u
          web="$(python3 scripts/ci/railway-var-fingerprint.py '@litlabs/litt-shell' TERMINAL_INTERNAL_SERVICE_KEY | grep 'TERMINAL_INTERNAL_SERVICE_KEY:')"
          ts="$(python3 scripts/ci/railway-var-fingerprint.py 'terminal-server' TERMINAL_INTERNAL_SERVICE_KEY | grep 'TERMINAL_INTERNAL_SERVICE_KEY:')"
          echo "web(@litlabs/litt-shell):   $web"
          echo "terminal(terminal-server): $ts"
          wl="$(echo "$web" | grep -o 'len=[0-9]*' | cut -d= -f2)"
          tl="$(echo "$ts" | grep -o 'len=[0-9]*' | cut -d= -f2)"
          ws="$(echo "$web" | grep -o 'sha256_16=[a-f0-9]*' | cut -d= -f2)"
          tsv="$(echo "$ts" | grep -o 'sha256_16=[a-f0-9]*' | cut -d= -f2)"
          if [ -z "$ws" ] || [ -z "$tsv" ]; then
            echo "VERDICT: INCONCLUSIVE — could not read both keys"
          elif [ "$ws" = "$tsv" ] && [ "$wl" = "$tl" ]; then
            echo "VERDICT: MATCH — same TERMINAL_INTERNAL_SERVICE_KEY on web and terminal-server"
          else
            echo "VERDICT: MISMATCH — web(len=$wl sha=$ws) vs terminal(len=$tl sha=$tsv)"
          fi
          exit 0

      - name: Production fingerprints (read-only, same safe rules)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          for svc in "web" "litlabs-terminal-server" "terminal-server"; do
            echo "=== PROD service: $svc ==="
            RAILWAY_ENV=production python3 scripts/ci/railway-var-fingerprint.py "$svc"               TERMINAL_INTERNAL_SERVICE_KEY TERMINAL_AUTH_SECRET || true
          done
          exit 0

      - name: Probe Gemini credential directly (prints HTTP status + error only, never the key)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, urllib.error, os, re

          def collect(node, vals):
              if isinstance(node, dict):
                  n, v = node.get("name"), node.get("value")
                  if isinstance(n, str) and isinstance(v, str):
                      vals[n] = v
                  for k, v2 in node.items():
                      if isinstance(k, str) and isinstance(v2, str) and k == k.upper() and k.replace("_","").isalnum():
                          vals.setdefault(k, v2)
                      else:
                          collect(v2, vals)
              elif isinstance(node, list):
                  for i in node: collect(i, vals)

          raw = subprocess.run(["railway","variable","list","--service","@litlabs/litt-shell","--json"],capture_output=True,text=True).stdout
          vals = {}
          try:
              collect(json.loads(raw), vals)
          except Exception as e:
              print("PARSE_FAIL", e); raise SystemExit(0)
          key = vals.get("GEMINI_API_KEY") or vals.get("GOOGLE_API_KEY") or ""
          print("key_present:", bool(key), "len:", len(key))
          if not key:
              raise SystemExit(0)

          def probe(url, payload=None):
              req = urllib.request.Request(url, data=json.dumps(payload).encode() if payload else None,
                                           headers={"Content-Type":"application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, r.read()[:400].decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:600].decode("utf-8","replace")
              except Exception as e:
                  return -1, str(e)

          st, body = probe(f"https://generativelanguage.googleapis.com/v1beta/models?key={key}")
          print("MODELS_LIST status:", st)
          print("MODELS_LIST body:", re.sub(key, "<redacted>", body)[:400])
          payload = {"contents":[{"parts":[{"text":"Reply with the word ok"}]}],"generationConfig":{"maxOutputTokens":16}}
          st, body = probe(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={key}", payload)
          print("GENERATE gemini-2.5-flash status:", st)
          print("GENERATE body:", re.sub(key, "<redacted>", body)[:600])
          PY
          exit 0

      - name: Provider error lines from staging web logs (filtered, no secrets)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          railway logs --service "@litlabs/litt-shell" --lines 20000 2>&1 \
            | grep -iE "gemini|forbidden|403|provider=|attempt_failure|health_disabled|credential" \
            | sed -E 's/(key|token|secret|password)([=: \t]+)[A-Za-z0-9_./+-]{8,}/\1\2<redacted>/gi' \
            | tail -120 || true
          exit 0

      - name: Service domains (non-secret)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          for svc in "@litlabs/litt-shell" "terminal-server" "litt-shell"; do
            echo "=== domain: $svc ==="
            railway domain --service "$svc" 2>&1 | head -10 || true
          done
          exit 0

      - name: Recent deployments (non-secret metadata)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          for svc in "@litlabs/litt-shell" "terminal-server" "litt-shell"; do
            echo "=== deployments: $svc ==="
            railway deployment list --service "$svc" 2>&1 | head -15 || true
          done
          exit 0
