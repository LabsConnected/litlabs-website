name: Railway Key Fingerprint Diagnostic

# READ-ONLY diagnostic (manual dispatch only). Compares the
# TERMINAL_INTERNAL_SERVICE_KEY configured on the staging web service
# (@litlabs/litt-shell) against the one on the staging terminal-server
# service — by length + SHA-256 fingerprint ONLY. Secret values are never
# printed. Also prints non-secret URL variables and the service inventory.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare terminal service-key fingerprints (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Service inventory
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway status || true
          railway status --json 2>/dev/null | head -100 || true

      - name: Fingerprint TERMINAL_INTERNAL_SERVICE_KEY per service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -u
          for svc in "@litlabs/litt-shell" "terminal-server" "litt-shell"; do
            echo "=== service: $svc ==="
            python3 scripts/ci/railway-var-fingerprint.py "$svc" \
              TERMINAL_INTERNAL_SERVICE_KEY INTERNAL_SERVICE_KEY TERMINAL_AUTH_SECRET
          done

      - name: Verdict
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -u
          web="$(python3 scripts/ci/railway-var-fingerprint.py '@litlabs/litt-shell' TERMINAL_INTERNAL_SERVICE_KEY | grep 'TERMINAL_INTERNAL_SERVICE_KEY:')"
          ts="$(python3 scripts/ci/railway-var-fingerprint.py 'terminal-server' TERMINAL_INTERNAL_SERVICE_KEY | grep 'TERMINAL_INTERNAL_SERVICE_KEY:')"
          echo "web(@litlabs/litt-shell):   $web"
          echo "terminal(terminal-server): $ts"
          wl="$(echo "$web" | grep -o 'len=[0-9]*' | cut -d= -f2)"
          tl="$(echo "$ts" | grep -o 'len=[0-9]*' | cut -d= -f2)"
          ws="$(echo "$web" | grep -o 'sha256_16=[a-f0-9]*' | cut -d= -f2)"
          tsv="$(echo "$ts" | grep -o 'sha256_16=[a-f0-9]*' | cut -d= -f2)"
          if [ -z "$ws" ] || [ -z "$tsv" ]; then
            echo "VERDICT: INCONCLUSIVE — could not read both keys"
          elif [ "$ws" = "$tsv" ] && [ "$wl" = "$tl" ]; then
            echo "VERDICT: MATCH — same TERMINAL_INTERNAL_SERVICE_KEY on web and terminal-server"
          else
            echo "VERDICT: MISMATCH — web(len=$wl sha=$ws) vs terminal(len=$tl sha=$tsv)"
          fi
          exit 0

      - name: Service domains (non-secret)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          for svc in "@litlabs/litt-shell" "terminal-server" "litt-shell"; do
            echo "=== domain: $svc ==="
            railway domain --service "$svc" 2>&1 | head -10 || true
          done
          exit 0

      - name: Recent deployments (non-secret metadata)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
        run: |
          for svc in "@litlabs/litt-shell" "terminal-server" "litt-shell"; do
            echo "=== deployments: $svc ==="
            railway deployment list --service "$svc" 2>&1 | head -15 || true
          done
          exit 0
