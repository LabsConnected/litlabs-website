name: Billing database concurrency

on:
  push:
    branches:
      - main
      - cursor/billing-paid-beta-remediation
      - cursor/stripe-658-hardening-c039
  pull_request:
    branches:
      - main
      - cursor/stripe-658-hardening-c039
      - fix/stripe-webhook-grant-race
  workflow_dispatch:

concurrency:
  group: billing-db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  billing-db:
    name: Billing database concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: litlabs_test
          POSTGRES_PASSWORD: litlabs_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U litlabs_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install PostgREST
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          chmod +x /tmp/postgrest
          /tmp/postgrest --help >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Start the disposable billing database
        run: bash scripts/billing-disposable-db.sh
        env:
          SUPABASE_JWT_SECRET: local-webhook-fixture-secret-not-a-credential
          BILLING_REPLAY_ADMIN_URL: postgresql://litlabs_test:litlabs_test@127.0.0.1:5432/postgres

      - name: Run the real-database billing suites
        env:
          CI: true
          BILLING_REQUIRE_DB: "1"
          RUN_BILLING_CONCURRENCY_DB: "1"
          RUN_STRIPE_LOCAL_DB: "1"
          BILLING_RACE_TRIALS: "25"
          SUPABASE_JWT_SECRET: local-webhook-fixture-secret-not-a-credential
          BILLING_REPLAY_ADMIN_URL: postgresql://litlabs_test:litlabs_test@127.0.0.1:5432/postgres
          BILLING_TEST_DATABASE_URL: postgresql://litlabs_test:litlabs_test@127.0.0.1:5432/litlabs_billing
          SUPABASE_DB_URL: postgresql://litlabs_test:litlabs_test@127.0.0.1:5432/litlabs_billing_race
          SUPABASE_LOCAL_API_URL: http://127.0.0.1:55321
        run: |
          set -euo pipefail
          run_required() {
            local file="$1"
            local out="/tmp/billing-db-report.json"
            rm -f "$out"
            pnpm exec vitest run "$file" --reporter=default --reporter=json --outputFile="$out"
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync("/tmp/billing-db-report.json", "utf8"));
              const skipped = report.numPendingTests ?? 0;
              const passed = report.numPassedTests ?? 0;
              if (skipped > 0 || passed < 1 || report.success === false) {
                console.error("billing database suite skipped or failed", { skipped, passed, success: report.success });
                process.exit(1);
              }
            '
          }
          run_required tests/billing/local-db-concurrency.integration.test.ts
          run_required tests/billing/subscription-apply-race.integration.test.ts
          run_required tests/billing/concurrent-subscription-conflict.integration.test.ts
          run_required tests/stripe-webhook-local-db.test.ts
