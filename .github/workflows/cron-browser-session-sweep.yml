name: Cron — Browser Session Sweep

# Sweeps idle LiTT browser sessions server-side so orphaned sessions
# don't hold billing holds or provider resources. Uses the existing
# INTERNAL_API_KEY credential (same as the deploy digest cron).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call browser session sweep endpoint
        env:
          SITE_URL: ${{ vars.SWEEP_URL || vars.DIGEST_URL || 'https://www.litlabs.net' }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          if [ -z "$INTERNAL_API_KEY" ]; then
            echo "::error::INTERNAL_API_KEY secret is not set"
            exit 1
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Internal-Api-Key: $INTERNAL_API_KEY" \
            "${SITE_URL}/api/litt/browser/sessions/sweep")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Browser session sweep returned HTTP $HTTP_CODE"
            exit 1
          fi
