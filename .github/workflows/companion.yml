name: Companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  companion:
    name: Companion typecheck and Android export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Type check companion
        run: pnpm --filter @litt/companion typecheck
        env:
          CI: true

      - name: Validate companion Android export
        run: pnpm --filter @litt/companion export
        env:
          CI: true
