name: Audit Deployment Controls

# Runs on schedule and on PR to detect unauthorized production deployment paths.
# This is a DETECTION workflow, not a prevention workflow — it alerts if
# someone adds an auto-deploying workflow or modifies the controlled ones.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Check for unauthorized deploy paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no workflow auto-deploys to production
        run: |
          set -e
          echo "Scanning workflows for automatic production deployment triggers..."
          FAIL=0
          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf")
            # Skip the controlled deployment workflows
            case "$name" in
              deploy-production.yml|deploy-terminal.yml|audit-deployment-controls.yml)
                continue
                ;;
            esac
            # Check for push-to-main triggers combined with railway/deploy actions
            if grep -q "branches:.*main" "$wf" && grep -qi "railway.*deploy\|railway up" "$wf"; then
              echo "::error::$name may auto-deploy on push to main"
              FAIL=1
            fi
            # Check for railway tokens in non-production environments
            if grep -q "RAILWAY_TOKEN" "$wf" && ! grep -q "environment:" "$wf"; then
              echo "::warning::$name uses RAILWAY_TOKEN without environment protection"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Unauthorized deployment paths detected"
            exit 1
          fi
          echo "No unauthorized deployment paths found."

      - name: Verify controlled workflows are manual-only
        run: |
          for wf in .github/workflows/deploy-production.yml; do
            if [ -f "$wf" ]; then
              if grep -q "push:" "$wf"; then
                echo "::error::$wf has push trigger — must be workflow_dispatch only"
                exit 1
              fi
              if ! grep -q "workflow_dispatch:" "$wf"; then
                echo "::error::$wf missing workflow_dispatch trigger"
                exit 1
              fi
              echo "$wf: manual-only confirmed"
            fi
          done
