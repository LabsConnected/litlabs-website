name: Audit Deployment Controls

# Runs on schedule and on PR to detect unauthorized production deployment paths.
# This is a DETECTION workflow, not a prevention workflow — it alerts if
# someone adds an auto-deploying workflow or modifies the controlled ones.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Check for unauthorized deploy paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no workflow auto-deploys to production
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          import yaml
          fail = False
          for wf in sorted(glob.glob(".github/workflows/*.yml")):
              name = os.path.basename(wf)
              text = open(wf).read()
              doc = yaml.safe_load(text)
              on = doc.get(True, doc.get("on", {})) or {}
              if isinstance(on, str):
                  on = {on: None}
              if isinstance(on, list):
                  on = {k: None for k in on}
              deploys = bool(re.search(r"railway\s+(up|deploy|redeploy)|serviceInstanceRedeploy|serviceInstanceDeploy", text, re.I))
              auto = [t for t in on if t in ("push", "pull_request", "pull_request_target", "schedule", "release", "workflow_run")]
              if deploys and auto and name != "audit-deployment-controls.yml":
                  print(f"::error::{name} can deploy to Railway on automatic trigger(s): {auto}")
                  fail = True
              if "RAILWAY_TOKEN" in text and "environment:" not in text and deploys:
                  print(f"::error::{name} uses RAILWAY_TOKEN to deploy without a protected environment")
                  fail = True
          if fail:
              sys.exit(1)
          print("No unauthorized deployment paths found.")
          PY

      - name: Verify controlled workflows are manual-only and gated
        run: |
          python3 - <<'PY'
          import sys
          import yaml
          doc = yaml.safe_load(open(".github/workflows/deploy-production.yml"))
          on = doc.get(True, doc.get("on", {}))
          if list(on.keys()) != ["workflow_dispatch"]:
              print(f"::error::deploy-production.yml must trigger on workflow_dispatch only, found {list(on.keys())}")
              sys.exit(1)
          deploy = doc["jobs"]["deploy"]
          env = deploy.get("environment")
          if (env.get("name") if isinstance(env, dict) else env) != "production":
              print("::error::deploy job must use the protected `production` environment")
              sys.exit(1)
          if "authorization" not in on["workflow_dispatch"]["inputs"]:
              print("::error::deploy-production.yml must require the explicit authorization input")
              sys.exit(1)
          old = yaml.safe_load(open(".github/workflows/deploy-terminal.yml"))
          oon = old.get(True, old.get("on", {}))
          if "push" in oon or "schedule" in oon:
              print("::error::deploy-terminal.yml must not have push/schedule triggers")
              sys.exit(1)
          print("deploy-production.yml: manual-only, authorization input present, production environment required")
          PY
