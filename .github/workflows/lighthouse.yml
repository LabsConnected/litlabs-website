name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  lighthouse:
    name: Run Lighthouse and upload reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build:workspace-deps

      - name: Build production Next.js
        run: pnpm build
        env:
          # Minimal env for build — Lighthouse audits the built output
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Start production server
        id: server
        run: |
          # Start Next.js production server on port 3000
          PORT=3000 pnpm start &
          SERVER_PID=$!
          echo "pid=$SERVER_PID" >> "$GITHUB_OUTPUT"

          # Wait for server to be ready (require HTTP 200)
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "Server ready (HTTP 200) after ${i} seconds"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, waiting 1s..."
            sleep 1
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Server not ready after 30 seconds"

      - name: Run Lighthouse
        if: steps.server.outputs.ready == 'true'
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/studio
          budgetPath: .github/budget.config.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/**/*

      - name: Stop server
        if: always() && steps.server.outputs.pid != ''
        run: |
          kill ${{ steps.server.outputs.pid }} 2>/dev/null || true
