name: Railway Terminal Secret Sync (staging)

# MANUAL DISPATCH ONLY — one-shot repair.
# Copies TERMINAL_INTERNAL_SERVICE_KEY and TERMINAL_AUTH_SECRET from the
# staging terminal-server service onto @litlabs/litt-shell so web->terminal
# internal auth matches again. Values travel via stdin and are NEVER
# printed; logs show only length + sha256_16 fingerprints.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC to confirm'
        required: true
        default: ''
      groq_ceiling:
        description: 'Optional: set GROQ_REQUEST_TOKEN_CEILING on staging web (integer). Empty = skip.'
        required: false
        default: ''

  # Registers the workflow on this diag branch; Confirm gate makes any
  # push-triggered run a no-op.
  push:
    branches: [diag/railway-key-fingerprint-20261118]

permissions:
  contents: read

jobs:
  sync:
    name: Sync terminal secrets web<-terminal (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm
        run: |
          [ "${{ inputs.confirm }}" = "SYNC" ] || { echo "::error::confirm input must be SYNC"; exit 1; }

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Optional Groq token ceiling (non-secret config, staging web only)
        if: ${{ inputs.groq_ceiling != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CEILING: ${{ inputs.groq_ceiling }}
        run: |
          [[ "$CEILING" =~ ^[0-9]+$ ]] || { echo "::error::groq_ceiling must be an integer"; exit 1; }
          railway variable set "GROQ_REQUEST_TOKEN_CEILING=$CEILING" --service "@litlabs/litt-shell"
          echo "Set GROQ_REQUEST_TOKEN_CEILING=$CEILING on @litlabs/litt-shell (staging)"

      - name: Sync secrets (values never printed)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python3 scripts/ci/railway-sync-terminal-secrets.py
