name: Migration Reproducibility

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/upgrade-validation/**"
      - "supabase/config.toml"
      - ".github/workflows/migration-reproducibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-reset:
    name: supabase db reset (clean replay)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Start Supabase
        run: npx supabase start
        env:
          CI: true

      - name: Reset database (replay all migrations)
        run: npx supabase db reset
        env:
          CI: true

      - name: Verify migration count
        run: |
          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration files on disk: $MIGRATION_COUNT"
          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "ERROR: No migration files found"
            exit 1
          fi

      - name: Run database contract tests
        run: npx supabase test db
        env:
          CI: true

      - name: Run PC pairing concurrency test
        run: node --test supabase/tests/pc_pairing_concurrency.test.mjs
        env:
          CI: true

      - name: Run PC pairing helper identity test
        run: node --test bridge-agent/pair.test.mjs
        env:
          CI: true

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
        env:
          CI: true

  bridge-agent-key-acl-windows:
    name: Bridge agent device-key ACL (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run device-key ACL regression test
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap bridge-agent/pair.test.mjs | tee test-output.tap
          if ! grep -qE '^ok [0-9]+ - a freshly created key file on Windows loses inherited ACEs and is scoped to the current user$' test-output.tap; then
            echo "::error::Windows device-key ACL test did not run as expected (missing or skipped) — failing closed."
            exit 1
          fi
          if ! grep -qE '^# skipped 0$' test-output.tap; then
            echo "::error::A Windows-only pairing test was skipped on windows-latest — failing closed."
            exit 1
          fi

  production-upgrade:
    name: Production-style migration upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Start Supabase
        run: npx supabase start
        env:
          CI: true

      - name: Run upgrade validation (run.sh)
        shell: bash
        run: bash supabase/upgrade-validation/run.sh
        env:
          CI: true

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
        env:
          CI: true
