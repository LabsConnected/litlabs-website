name: Staging Clerk Auth Validation

on:
  workflow_dispatch:
    inputs:
      expected_staging_sha:
        description: "Approved deployed staging commit SHA (exact 40-character lowercase hex)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-clerk-auth-validation
  cancel-in-progress: false

jobs:
  staging-clerk-auth:
    name: Staging Clerk Auth Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_URL: https://litlabslitt-shell-staging.up.railway.app
      EXPECTED_CLERK_INSTANCE: ins_3Eel6w2QA2Id5utwcc3vDqCGZiz
      EXPECTED_CLERK_DOMAIN: eternal-chow-60.clerk.accounts.dev
      EXPECTED_STAGING_SHA: ${{ inputs.expected_staging_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate required configuration and Clerk instance
        shell: bash
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          CLERK_TEST_USER_A_EMAIL: ${{ secrets.CLERK_TEST_USER_A_EMAIL }}
          CLERK_TEST_USER_B_EMAIL: ${{ secrets.CLERK_TEST_USER_B_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          required=(
            CLERK_TEST_PUBLISHABLE_KEY
            CLERK_TEST_SECRET_KEY
            CLERK_TEST_USER_A_EMAIL
            CLERK_TEST_USER_B_EMAIL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          if [[ "$CLERK_TEST_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo "Clerk publishable key is not a Development/test key"
            exit 1
          fi
          if [[ "$CLERK_TEST_SECRET_KEY" != sk_test_* ]]; then
            echo "Clerk secret key is not a Development/test key"
            exit 1
          fi
          if [ "$CLERK_TEST_USER_A_EMAIL" != "litt.test.one@example.com" ] || [ "$CLERK_TEST_USER_B_EMAIL" != "litt.test.two@example.com" ]; then
            echo "Configured test identities do not match the approved dedicated identities"
            exit 1
          fi

          instance_json="$RUNNER_TEMP/clerk-instance.json"
          if ! curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLERK_TEST_SECRET_KEY" \
            --header "Accept: application/json" \
            "https://api.clerk.com/v1/instance" > "$instance_json"; then
            echo "Clerk instance verification request failed"
            exit 1
          fi
          if ! jq -e --arg expected "$EXPECTED_CLERK_INSTANCE" \
            '.id == $expected and .environment_type == "development"' \
            "$instance_json" > /dev/null; then
            echo "Clerk secret is not associated with the approved Development instance"
            exit 1
          fi
          rm -f "$instance_json"
          echo "Clerk configuration validation: PASS"

      - name: Validate staging Clerk domain
        shell: bash
        run: |
          set -euo pipefail
          domain_check="$RUNNER_TEMP/staging-clerk-domain-check.log"
          if ! node - <<'NODE' > "$domain_check" 2>&1
          const { chromium } = require("@playwright/test");
          const base = process.env.STAGING_URL;
          const expected = process.env.EXPECTED_CLERK_DOMAIN;
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.goto(`${base}/sign-in`, { waitUntil: "domcontentloaded", timeout: 60000 });
              await page.waitForFunction(() => Boolean(globalThis.Clerk?.loaded), undefined, { timeout: 30000 });
              const frontendApi = await page.evaluate(() => String(globalThis.Clerk?.frontendApi ?? ""));
              if (!frontendApi || !frontendApi.includes(expected)) process.exit(1);
            } finally {
              await browser.close();
            }
          })().catch(() => process.exit(1));
          NODE
          then
            echo "Staging Clerk domain does not match the approved Development domain"
            exit 1
          fi
          rm -f "$domain_check"
          echo "Staging Clerk domain validation: PASS"

      - name: Verify staging health and approved deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/staging-health.json"
          if ! curl --fail --silent --show-error --max-time 30 "$STAGING_URL/api/health" > "$health"; then
            echo "Staging health request failed"
            exit 1
          fi
          if ! jq -e '.status == "ok" and .checks.auth.status == "ok"' "$health" > /dev/null; then
            echo "Staging health/auth check failed"
            exit 1
          fi

          expected="${EXPECTED_STAGING_SHA,,}"
          actual="$(jq -r '.checks.build.detail // empty' "$health" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_staging_sha input"
            rm -f "$health"
            exit 1
          fi
          if [ -z "$actual" ] || ! [[ "$actual" =~ ^([0-9a-f]{8}|[0-9a-f]{40})$ ]]; then
            echo "Staging deployment SHA unavailable"
            rm -f "$health"
            exit 1
          fi
          if [[ "$actual" =~ ^[0-9a-f]{8}$ ]]; then
            matches_target="${expected:0:8}"
          else
            matches_target="$expected"
          fi
          if [ "$actual" != "$matches_target" ]; then
            echo "STAGING_DEPLOYMENT_DRIFT expected=$expected actual=$actual"
            rm -f "$health"
            exit 1
          fi
          echo "Staging deployment SHA validation: PASS ($actual)"
          rm -f "$health"

      - name: Authenticate User A and User B
        id: auth_setup
        shell: bash
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          CLERK_TEST_USER_A_EMAIL: ${{ secrets.CLERK_TEST_USER_A_EMAIL }}
          CLERK_TEST_USER_B_EMAIL: ${{ secrets.CLERK_TEST_USER_B_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          PLAYWRIGHT_STAGING_AUTH: true
        run: |
          set -euo pipefail
          cleanup() { rm -rf playwright-report test-results; }
          trap cleanup EXIT
          auth_log="$RUNNER_TEMP/staging-clerk-auth-setup.log"
          if ! PLAYWRIGHT_BASE_URL="$STAGING_URL" \
            pnpm exec playwright test --config playwright.config.ts --project=auth-setup \
            > "$auth_log" 2>&1; then
            echo "Authenticated Clerk setup: FAIL"
            exit 1
          fi
          echo "User A authentication: PASS"
          echo "User B authentication: PASS"

      - name: Run integration suite
        id: integration
        if: always() && steps.auth_setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          CLERK_TEST_USER_A_EMAIL: ${{ secrets.CLERK_TEST_USER_A_EMAIL }}
          CLERK_TEST_USER_B_EMAIL: ${{ secrets.CLERK_TEST_USER_B_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          PLAYWRIGHT_STAGING_AUTH: true
        run: |
          set +e
          report="$RUNNER_TEMP/staging-integration.json"
          stderr_log="$RUNNER_TEMP/staging-integration.stderr"
          PLAYWRIGHT_BASE_URL="$STAGING_URL" \
            pnpm exec playwright test --config playwright.config.ts \
              --project=staging-integration tests/playwright/integration.spec.ts \
              --reporter=json > "$report" 2> "$stderr_log"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Run isolation suite
        id: isolation
        if: always() && steps.auth_setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          CLERK_TEST_USER_A_EMAIL: ${{ secrets.CLERK_TEST_USER_A_EMAIL }}
          CLERK_TEST_USER_B_EMAIL: ${{ secrets.CLERK_TEST_USER_B_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          PLAYWRIGHT_STAGING_AUTH: true
        run: |
          set +e
          report="$RUNNER_TEMP/staging-isolation.json"
          stderr_log="$RUNNER_TEMP/staging-isolation.stderr"
          PLAYWRIGHT_BASE_URL="$STAGING_URL" \
            pnpm exec playwright test --config playwright.config.ts \
              --project=staging-isolation tests/playwright/isolation.spec.ts \
              --reporter=json > "$report" 2> "$stderr_log"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Emit sanitized suite results and final verdict
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.auth_setup.outcome }}
          INTEGRATION_STATUS: ${{ steps.integration.outputs.status }}
          ISOLATION_STATUS: ${{ steps.isolation.outputs.status }}
          INTEGRATION_REPORT: ${{ runner.temp }}/staging-integration.json
          ISOLATION_REPORT: ${{ runner.temp }}/staging-isolation.json
        run: |
          set -u
          cleanup() {
            rm -rf tests/playwright/.clerk playwright-report test-results
            rm -f "$INTEGRATION_REPORT" "$ISOLATION_REPORT" \
              "$RUNNER_TEMP/staging-integration.stderr" "$RUNNER_TEMP/staging-isolation.stderr" \
              "$RUNNER_TEMP/staging-clerk-auth-setup.log"
          }
          trap cleanup EXIT

          summarize() {
            local suite="$1"
            local report="$2"
            local status="$3"
            SUITE="$suite" REPORT="$report" COMMAND_STATUS="$status" \
              python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import os
          import re
          import sys

          suite = os.environ["SUITE"]
          report = os.environ["REPORT"]
          command_status = os.environ.get("COMMAND_STATUS", "1")

          def safe_title(value):
              value = re.sub(r"https?://\S+", "<url>", str(value))
              value = re.sub(r"(?i)(token|secret|cookie|authorization|bearer)\s*[:=]\s*\S+", r"\1=<redacted>", value)
              return re.sub(r"\s+", " ", value).strip()[:180]

          def category(errors):
              text = " ".join(str(error) for error in errors).lower()
              if "timeout" in text or "timedout" in text:
                  return "timeout"
              if any(term in text for term in ("401", "403", "clerk", "auth", "unauthorized")):
                  return "auth"
              if any(term in text for term in ("econnrefused", "enotfound", "network", "fetch", "connection")):
                  return "network"
              if any(term in text for term in ("expect", "assert", "to be", "tohave")):
                  return "assertion"
              return "runner"

          counts = {"passed": 0, "failed": 0, "skipped": 0}
          failures = []
          parse_category = ""
          parsed = False
          try:
              with open(report, encoding="utf-8") as handle:
                  payload = json.load(handle)
              if not isinstance(payload, dict):
                  raise ValueError("report is not an object")
              parsed = True
              def visit(node, parents=()):
                  for spec in node.get("specs", []):
                      title = " ".join((*parents, str(spec.get("title", "")))).strip()
                      for test in spec.get("tests", []):
                          results = test.get("results", [])
                          statuses = [str(result.get("status", "")) for result in results]
                          if any(status in {"failed", "timedOut", "interrupted"} for status in statuses):
                              counts["failed"] += 1
                              errors = [error for result in results for error in result.get("errors", [])]
                              failures.append((safe_title(title), category(errors)))
                          elif all(status == "skipped" for status in statuses) and statuses:
                              counts["skipped"] += 1
                          else:
                              counts["passed"] += 1
                  for child in node.get("suites", []):
                      visit(child, (*parents, str(node.get("title", ""))))
              for suite_node in payload.get("suites", []):
                  visit(suite_node)
          except Exception:
              parse_category = "runner"

          total = counts["passed"] + counts["failed"] + counts["skipped"]
          if not parsed or total == 0 or counts["passed"] == 0:
              counts["failed"] = max(counts["failed"], 1)
              failures.append(("report-unavailable", parse_category or "runner"))
          elif command_status != "0" and counts["failed"] == 0:
              counts["failed"] = 1
              failures.append(("report-unavailable", "runner"))
          status = "PASS" if command_status == "0" and parsed and total > 0 and counts["passed"] > 0 and counts["failed"] == 0 else "FAIL"
          print(f"- {suite}: {status} (passed={counts['passed']}, failed={counts['failed']}, skipped={counts['skipped']})")
          if failures:
              categories = sorted({item[1] for item in failures})
              print(f"- {suite} failure categories: {', '.join(categories)}")
              print(f"- {suite} failing tests:")
              for title, _ in failures[:20]:
                  print(f"  - {title}")
          sys.exit(0 if status == "PASS" else 1)
          PY
          }

          failure=0
          if [ "${AUTH_OUTCOME:-}" != "success" ]; then
            echo "- auth-setup: FAIL" >> "$GITHUB_STEP_SUMMARY"
            failure=1
          fi
          if [ -n "${INTEGRATION_STATUS:-}" ] && [ -f "$INTEGRATION_REPORT" ]; then
            if ! summarize "integration" "$INTEGRATION_REPORT" "$INTEGRATION_STATUS"; then
              failure=1
            fi
          else
            echo "- integration: NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
            failure=1
          fi
          if [ -n "${ISOLATION_STATUS:-}" ] && [ -f "$ISOLATION_REPORT" ]; then
            if ! summarize "isolation" "$ISOLATION_REPORT" "$ISOLATION_STATUS"; then
              failure=1
            fi
          else
            echo "- isolation: NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
            failure=1
          fi
          if [ "$failure" -eq 0 ]; then
            echo "- overall: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- overall: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
