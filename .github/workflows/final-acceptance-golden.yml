name: Final Acceptance — Production Mobile Golden

# Manual trigger only. Runs scripts/final-acceptance/prod-mobile-golden.mjs
# (a real, Clerk-authenticated Playwright session against production —
# see that script's own header comment) on a normal Linux runner, since
# Playwright's browser binaries have no Android/Termux build and cannot
# be launched from an on-device CLI environment.
#
# CLERK_SECRET_KEY is the same repository secret build.yml's own
# Playwright/production-build steps already use — never printed, never
# written to the produced artifact (the script only ever uses it as a
# Bearer header value to mint a short-lived sign-in token).
#
# Every acceptance run creates a disposable Clerk user immediately before
# the browser journey. The generated id is passed to the script so a stale
# QA identity can never make a run appear fresh.
on:
  workflow_dispatch:
    inputs:
      provision_only:
        description: "One-time setup: create the permanent golden project and print its ID (register as LITT_GOLDEN_PROJECT_ID secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golden:
    name: Golden mobile build/action journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision permanent golden project
        if: inputs.provision_only
        run: node scripts/final-acceptance/provision-golden-project.mjs
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          LITT_ACCEPTANCE_USER_ID: ${{ secrets.LITT_ACCEPTANCE_USER_ID }}

      - name: Create disposable fresh acceptance account
        id: fresh-user
        if: ${{ !inputs.provision_only }}
        run: echo "user_id=$(node scripts/final-acceptance/create-fresh-user.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Run production golden acceptance
        if: ${{ !inputs.provision_only }}
        run: node scripts/final-acceptance/prod-mobile-golden.mjs
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          LITT_ACCEPTANCE_USER_ID: ${{ steps.fresh-user.outputs.user_id }}
          LITT_ACCEPTANCE_FRESH_ACCOUNT: "1"
          # Fresh mode deliberately ignores the permanent-project secret and
          # creates a dedicated empty-static project under the new user.
          LITT_GOLDEN_PROJECT_ID: ""
          # project.deploy is the production deploy target for user projects
          # (publishes a verified snapshot to /sites/[deploymentId]). The
          # golden requests "deploy it live", proves the approval gate
          # engages, approves via the real endpoint, and fetches the live URL.
          LITT_ACCEPTANCE_DEPLOY: "1"

      - name: Upload acceptance artifacts (verdict, SSE log, screenshots, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-acceptance-golden-${{ github.run_id }}
          path: artifacts/final-acceptance/**
          retention-days: 14
