name: Gitleaks

# Public repository: this job must never print a secret value.
# Findings are reported as rule, file, and line only (--redact=100 plus a
# template that omits match text). No report artifact is uploaded.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "${expected}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +x
          scan_log="$(mktemp)"
          report="$(mktemp)"
          trap 'rm -f "$scan_log" "$report"' EXIT
          GITLEAKS_STATUS=0

          # Flags stay in front of the repo path. The report template prints
          # rule, file, and line only; --redact=100 covers the summary too.
          run_gitleaks() {
            cmd="$1"
            shift
            set +e
            gitleaks "$cmd" --no-banner --no-color --redact=100 \
              --config .gitleaks.toml \
              --report-format template \
              --report-template .github/gitleaks-report.tmpl \
              --report-path "$report" \
              "$@" >"$scan_log" 2>&1
            GITLEAKS_STATUS=$?
            set -e
            cat "$scan_log"
            if grep -q '[^[:space:]]' "$report"; then
              echo "Findings (rule, file, line only):"
              cat "$report"
            fi
          }

          require_commits() {
            # Match the zero-commit summary only. "10 commits scanned" must not match.
            if grep -q "INF 0 commits scanned" "$scan_log"; then
              echo "::error::gitleaks scanned 0 commits for $1"
              exit 1
            fi
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" || git fetch --no-tags origin "${{ github.base_ref }}"
            fi
            range="${BASE_SHA}..${HEAD_SHA}"
            echo "Scanning pull request commits ${range}"
            run_gitleaks git --log-opts="$range" .
            require_commits "$range"
            exit "$GITLEAKS_STATUS"
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE_SHA}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "Scanning pushed tree (no previous commit on this ref)"
              run_gitleaks dir .
              exit "$GITLEAKS_STATUS"
            fi
            range="${BEFORE_SHA}..${PUSH_SHA}"
            echo "Scanning pushed commits ${range}"
            run_gitleaks git --log-opts="$range" .
            require_commits "$range"
            exit "$GITLEAKS_STATUS"
          fi

          echo "Scanning working tree"
          run_gitleaks dir .
          exit "$GITLEAKS_STATUS"
