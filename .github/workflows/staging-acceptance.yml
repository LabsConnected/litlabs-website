name: Staging Builder Acceptance (10 consecutive)

# Manual-dispatch ONLY. Runs the real golden acceptance journey against the
# deployed STAGING app — a fresh disposable Clerk user per iteration drives
# the build → approve → deploy-live → fetch-URL flow via
# scripts/final-acceptance/prod-mobile-golden.mjs, reusing the production
# harness with LITT_PROD_BASE_URL pointed at staging and the Clerk TEST
# instance secrets (sk_test_/pk_test_, never live keys).
#
# Acceptance contract: TEN consecutive green iterations, fresh user and
# fresh project every time. The job fails on the first failed iteration and
# reports the consecutive-pass count — N<10 is a NO-GO signal, never a pass.
on:
  workflow_dispatch:
    inputs:
      expected_staging_sha:
        description: "Approved 40-char SHA staging web and terminal must serve"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-builder-acceptance
  cancel-in-progress: false

env:
  STAGING_URL: https://litlabslitt-shell-staging.up.railway.app
  STAGING_TERMINAL_URL: https://terminal-server-staging.up.railway.app
  STAGING_PROJECT_ID: 3d5b8abe-088c-4a6c-9b34-7054829247c9
  STAGING_ENVIRONMENT_ID: 8631ff55-0835-449b-942e-a9c3748dea98
  STAGING_WEB_SERVICE_ID: 0fbedda0-0053-481c-9e4f-a3ea8100eb16
  STAGING_TERMINAL_SERVICE_ID: 3c06dd64-e82f-4bb5-8c47-d65dede36af9
  ACCEPTANCE_RUNS: 10

jobs:
  acceptance:
    name: 10 consecutive golden journeys on staging
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EXPECTED_SHA: ${{ inputs.expected_staging_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep the acceptance assertions from the dispatched workflow ref;
          # expected_staging_sha identifies the deployed app, not the harness.
          ref: ${{ github.sha }}

      - name: Validate approved SHA
        run: |
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_staging_sha must be a full lowercase commit SHA"
            exit 1
          fi

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Railway CLI for exact deployment evidence
        run: npm install -g @railway/cli

      - name: Verify staging is healthy before acceptance
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::staging Railway project token is required"; exit 1; }
          scope="$(railway api 'query { projectToken { projectId environmentId } }' --compact)"
          printf '%s' "$scope" | jq -e \
            --arg project "$STAGING_PROJECT_ID" --arg environment "$STAGING_ENVIRONMENT_ID" \
            '.data.projectToken.projectId == $project and .data.projectToken.environmentId == $environment' \
            > /dev/null || { echo "::error::Railway token is not scoped to staging"; exit 1; }
          body="$(curl -fsS --max-time 30 "$STAGING_URL/api/health")"
          echo "$body" | jq -e '.status == "ok"' > /dev/null \
            || { echo "::error::staging not healthy — refusing acceptance run"; echo "$body" | head -c 500; exit 1; }
          echo "staging healthy: $(echo "$body" | jq -r .commit)"
          detail="$(echo "$body" | jq -r '.checks.build.detail')"
          [ "$detail" = "$EXPECTED_SHA" ] \
            || { echo "::error::staging web serves $detail, expected $EXPECTED_SHA"; exit 1; }
          terminal="$(curl -fsS --max-time 30 "$STAGING_TERMINAL_URL/health")"
          echo "$terminal" | jq -e --arg commit "${EXPECTED_SHA:0:8}" \
            '.status == "ok" and .readiness == "ready" and .commit == $commit and
             .terminal.sandbox.execution == "enabled" and .terminal.sandbox.state == "verified"' \
            > /dev/null || { echo "::error::staging terminal SHA, readiness, or isolation check failed"; exit 1; }
          terminal_sha="$(railway variable list --service "$STAGING_TERMINAL_SERVICE_ID" --json | jq -r '.RAILWAY_GIT_COMMIT_SHA // empty')"
          [ "$terminal_sha" = "$EXPECTED_SHA" ] \
            || { echo "::error::terminal full SHA metadata differs from approved SHA"; exit 1; }

      - name: Clean up tagged disposable acceptance users
        # The Clerk TEST instance caps at 100 users and every iteration
        # permanently creates one — prior runs' leftovers blocked dispatch
        # (HTTP 403 user_quota_exceeded, run 42446254903). The script only
        # ever deletes public_metadata.littAcceptance === true users.
        run: node scripts/final-acceptance/cleanup-acceptance-users.mjs
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}

      - name: Run 10 consecutive golden journeys
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          LITT_PROD_BASE_URL: ${{ env.STAGING_URL }}
          LITT_ACCEPTANCE_FRESH_ACCOUNT: "1"
          LITT_ACCEPTANCE_DEPLOY: "1"
          LITT_GOLDEN_PROJECT_ID: ""
        run: |
          set -euo pipefail
          verify_exact_deployments() {
            local phase="$1" iteration="$2"
            local web_sha terminal terminal_sha state web_id terminal_id
            web_sha="$(curl -fsS --max-time 20 "$STAGING_URL/api/health" | jq -r '.checks.build.detail // empty')"
            [ "$web_sha" = "$EXPECTED_SHA" ] \
              || { echo "::error::web SHA drift $phase iteration $iteration: $web_sha"; return 1; }
            terminal="$(curl -fsS --max-time 20 "$STAGING_TERMINAL_URL/health")"
            printf '%s' "$terminal" | jq -e --arg commit "${EXPECTED_SHA:0:8}" \
              '.status == "ok" and .readiness == "ready" and .commit == $commit and
               .terminal.sandbox.execution == "enabled" and .terminal.sandbox.state == "verified"' \
              > /dev/null || { echo "::error::terminal runtime or isolation drift $phase iteration $iteration"; return 1; }
            terminal_sha="$(railway variable list --service "$STAGING_TERMINAL_SERVICE_ID" --json | jq -r '.RAILWAY_GIT_COMMIT_SHA // empty')"
            [ "$terminal_sha" = "$EXPECTED_SHA" ] \
              || { echo "::error::terminal full SHA metadata drift $phase iteration $iteration: $terminal_sha"; return 1; }
            state="$(railway status --json)"
            web_id="$(printf '%s' "$state" | jq -r --arg environment "$STAGING_ENVIRONMENT_ID" --arg service "$STAGING_WEB_SERVICE_ID" \
              '[.environments.edges[].node | select(.id == $environment) | .serviceInstances.edges[].node |
                select(.serviceId == $service) | .activeDeployments[] | select(.status == "SUCCESS") | .id] |
                if length == 1 then .[0] else empty end')"
            terminal_id="$(printf '%s' "$state" | jq -r --arg environment "$STAGING_ENVIRONMENT_ID" --arg service "$STAGING_TERMINAL_SERVICE_ID" \
              '[.environments.edges[].node | select(.id == $environment) | .serviceInstances.edges[].node |
                select(.serviceId == $service) | .activeDeployments[] | select(.status == "SUCCESS") | .id] |
                if length == 1 then .[0] else empty end')"
            [ -n "$web_id" ] && [ -n "$terminal_id" ] \
              || { echo "::error::active staging deployment identity unavailable"; return 1; }
            if [ -z "${baseline_web_id:-}" ]; then
              baseline_web_id="$web_id"
              baseline_terminal_id="$terminal_id"
            fi
            [ "$web_id" = "$baseline_web_id" ] && [ "$terminal_id" = "$baseline_terminal_id" ] \
              || { echo "::error::staging deployment changed $phase iteration $iteration"; return 1; }
            echo "iteration $iteration $phase: web_sha=$web_sha terminal_sha=$terminal_sha web_deployment=$web_id terminal_deployment=$terminal_id"
          }
          passes=0
          for i in $(seq 1 "$ACCEPTANCE_RUNS"); do
            echo "=== acceptance iteration $i/$ACCEPTANCE_RUNS ==="
            echo "CONSECUTIVE_PASSES=$passes" >> "$GITHUB_ENV"
            verify_exact_deployments before "$i"
            user_id="$(node scripts/final-acceptance/create-fresh-user.mjs)"
            echo "fresh user: $user_id"
            journey_passed=0
            if LITT_ACCEPTANCE_USER_ID="$user_id" \
               node scripts/final-acceptance/prod-mobile-golden.mjs; then
              journey_passed=1
            fi
            verify_exact_deployments after "$i"
            if [ "$journey_passed" -eq 1 ]; then
              passes=$((passes + 1))
              echo "iteration $i: PASS (consecutive=$passes)"
            else
              echo "::error::iteration $i: FAIL (consecutive=$passes)"
              echo "CONSECUTIVE_PASSES=$passes" >> "$GITHUB_ENV"
              exit 1
            fi
          done
          echo "CONSECUTIVE_PASSES=$passes" >> "$GITHUB_ENV"
          echo "ALL $ACCEPTANCE_RUNS consecutive acceptance runs PASSED"

      - name: Clean up tagged disposable acceptance users (post-run)
        # Every iteration's user is disposable by design — removing them
        # keeps the 100-user TEST instance from accumulating quota debt for
        # the next run. Runs even on fail-fast/cancel (if: always()). The
        # same tagged-only predicate protects all other users.
        if: always()
        run: node scripts/final-acceptance/cleanup-acceptance-users.mjs || echo "::warning::acceptance user cleanup failed (non-fatal)"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}

      - name: Report consecutive-pass count
        if: always()
        run: |
          echo "- consecutive acceptance passes: ${CONSECUTIVE_PASSES:-0}/$ACCEPTANCE_RUNS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.run_id }}
          path: artifacts/final-acceptance/**
          retention-days: 14
          if-no-files-found: ignore
