name: Deploy Terminal Server

on:
  push:
    branches: [main]
    paths:
      - "terminal-server/**"
      - "docker/Dockerfile.terminal"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RAILWAY_TOKEN
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN GitHub secret is not set. Skipping deployment."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Railway CLI
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: steps.check_token.outputs.has_token == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd terminal-server
          railway up --service litlabs-terminal-server

      - name: Health check
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          sleep 30
          curl -sSf --retry 3 --retry-delay 10 \
            https://litlabs-terminal-server-production-0be1.up.railway.app/health/ready \
            | jq -e '.readiness == "ready"'
