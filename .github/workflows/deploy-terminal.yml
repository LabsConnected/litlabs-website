name: Deploy Terminal Server

on:
  push:
    branches: [main]
    paths:
      - "terminal-server/**"
      - "docker/Dockerfile.terminal"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RAILWAY_TOKEN
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN GitHub secret is not set. Skipping deployment."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Railway CLI
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install -g @railway/cli

      - name: Set deployed commit metadata
        if: steps.check_token.outputs.has_token == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          # railway up (CLI upload) does NOT inject Railway's predefined
          # RAILWAY_GIT_COMMIT_SHA — that only happens with Railway's own
          # GitHub integration. Set it explicitly from the GitHub commit SHA
          # so /health, /health/ready, and /health/live report the real
          # deployed commit instead of falling back to "dev".
          # Do not run `railway variables` here: that command prints every
          # service variable. This step sets only the public commit SHA.
          railway variable set RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} \
            --service litlabs-terminal-server \
            --skip-deploys

      - name: Deploy to Railway
        if: steps.check_token.outputs.has_token == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          railway up --service litlabs-terminal-server

      - name: Health check
        if: steps.check_token.outputs.has_token == 'true'
        env:
          # Optional repo variable; defaults to the production terminal service.
          TERMINAL_BASE_URL: ${{ vars.TERMINAL_BASE_URL || 'https://litlabs-terminal-server-production-0be1.up.railway.app' }}
        run: |
          sleep 30
          curl -sSf --retry 3 --retry-delay 10 \
            "${TERMINAL_BASE_URL%/}/health/ready" \
            | jq -e '.readiness == "ready"'
