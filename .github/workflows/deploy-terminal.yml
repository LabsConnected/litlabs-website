name: Deploy Terminal Server (manual, CI-gated)

# PRODUCTION RELEASE WORKFLOW
#
# This workflow NEVER runs automatically. A push to main does not deploy the
# terminal server. A person starts it from the Actions tab, picks a commit that
# is already on main, and (via the `production-terminal` environment's required
# reviewers) a second approval click is needed before anything is deployed.
#
# Gates, in order:
#   1. The commit must be an ancestor of main.
#   2. Required CI check runs must have concluded "success" on that exact commit.
#   3. The `production-terminal` GitHub environment must approve the run.
#
# NOTE: this does not control Railway's own GitHub integration. Turn Autodeploy
# OFF (or enable "Wait for CI") on every Railway service that is connected to
# this repo. See docs/DEPLOYMENT_CONTROLS.md.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on main to deploy (40 characters)"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-terminal-production
  cancel-in-progress: false

env:
  REQUIRED_CHECKS: "Terminal Server Tests|Build and Type Check"

jobs:
  verify:
    name: Verify commit and CI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.val.outputs.sha }}
    steps:
      - name: Validate SHA format
        id: val
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set +x
          if ! printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.val.outputs.sha }}
          fetch-depth: 0

      - name: Commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ steps.val.outputs.sha }}" origin/main; then
            echo "::error::Commit is not an ancestor of main. Refusing to deploy."
            exit 1
          fi

      - name: Required CI checks must have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.val.outputs.sha }}
        run: |
          set +x
          runs=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --jq '.check_runs')
          fail=0
          IFS='|' read -ra NAMES <<< "$REQUIRED_CHECKS"
          for n in "${NAMES[@]}"; do
            concl=$(echo "$runs" | jq -r --arg n "$n" '[.[] | select(.name==$n)] | sort_by(.completed_at) | last | .conclusion // "missing"')
            echo "$n: $concl"
            if [ "$concl" != "success" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::A required CI check is not green on $SHA. Refusing to deploy."
            exit 1
          fi

  deploy:
    name: Deploy to production (needs approval)
    needs: verify
    runs-on: ubuntu-latest
    # Configure required reviewers + "main only" deployment branches on this
    # environment in GitHub: Settings -> Environments -> production-terminal.
    environment:
      name: production-terminal
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Check RAILWAY_TOKEN
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set for the production-terminal environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set deployed commit metadata
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          # Sets only the public commit SHA. Never run `railway variables`
          # here: it prints every service variable into the log.
          railway variable set RAILWAY_GIT_COMMIT_SHA=${{ needs.verify.outputs.sha }} \
            --service litlabs-terminal-server \
            --skip-deploys

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          railway up --service litlabs-terminal-server

      - name: Health check
        run: |
          sleep 30
          curl -sSf --retry 3 --retry-delay 10 \
            https://litlabs-terminal-server-production-0be1.up.railway.app/health/ready \
            | jq -e '.readiness == "ready"'
