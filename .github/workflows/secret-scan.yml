name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license (GITLEAKS_LICENSE).
      # Run the free open-source gitleaks binary directly instead.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "Installing gitleaks ${GITLEAKS_VERSION}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Baseline approach: .gitleaks.baseline captures the 185 historical
      # findings (all in _home_archive.zip, secrets rotated per #427).
      # Pull requests scan only the commits introduced by the PR. Pushes to
      # main, scheduled runs, and manual runs retain repository-wide coverage.
      - name: Verify synthetic detection in a bounded commit range
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          synthetic_repo="$TMPDIR/gitleaks-synthetic-repo"
          synthetic_log="$TMPDIR/gitleaks-synthetic.log"
          rm -rf "$synthetic_repo"
          mkdir -p "$synthetic_repo"
          git -C "$synthetic_repo" init -q
          git -C "$synthetic_repo" config user.name "Gitleaks self-test"
          git -C "$synthetic_repo" config user.email "gitleaks-self-test@localhost"
          printf '%s\n' 'clean fixture' > "$synthetic_repo/fixture.txt"
          git -C "$synthetic_repo" add fixture.txt
          git -C "$synthetic_repo" commit -q -m "clean fixture"
          synthetic_value="$(openssl rand -hex 32)"
          printf 'api_key = "%s"\n' "$synthetic_value" > "$synthetic_repo/synthetic-secret.txt"
          git -C "$synthetic_repo" add synthetic-secret.txt
          git -C "$synthetic_repo" commit -q -m "synthetic secret fixture"
          set +e
          gitleaks detect \
            --source "$synthetic_repo" \
            --log-opts="HEAD~1..HEAD" \
            --verbose \
            --redact \
            --exit-code 1 > "$synthetic_log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Gitleaks synthetic-range self-test did not detect the controlled fixture (exit=$status)."
            exit 1
          fi
          echo "Gitleaks synthetic-range self-test passed: expected detection occurred in HEAD~1..HEAD."

      - name: Run gitleaks detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git cat-file -e "$PR_HEAD_SHA^{commit}"
            merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            git merge-base --is-ancestor "$merge_base" "$PR_HEAD_SHA"
            log_opts="${merge_base}..${PR_HEAD_SHA}"
            echo "Gitleaks scan mode=pull_request range=${log_opts}"
          else
            log_opts="--all"
            echo "Gitleaks scan mode=repository-wide range=--all"
          fi
          gitleaks detect \
            --source . \
            --log-opts="$log_opts" \
            --baseline-path .gitleaks.baseline \
            --verbose \
            --redact \
            --exit-code 1
