name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license (GITLEAKS_LICENSE).
      # Run the free open-source gitleaks binary directly instead.
      # Pinned version (not "latest") to avoid GitHub API rate limits on shared runners.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="v8.28.0"
          echo "Installing gitleaks ${GITLEAKS_VERSION}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Baseline approach: .gitleaks.baseline captures the 185 historical
      # findings (all in _home_archive.zip, secrets rotated per #427).
      # Only NEW secrets fail the build — no history rewrite needed.
      - name: Run gitleaks detect
        run: gitleaks detect --source . --baseline-path .gitleaks.baseline --verbose --redact --exit-code 1
