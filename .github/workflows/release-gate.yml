name: Release Gate

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes — verify deployed SHAs match source
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  verify-deployment-sha:
    name: Verify Deployed SHA Matches Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check web health endpoint
        id: web
        run: |
          set +x
          RESPONSE=$(curl -sSf --max-time 10 \
            "https://www.litlabs.net/api/health" || echo '{"status":"unreachable"}')
          # Keep the raw body in this step only. It is not stored as a step
          # output: database errors in the payload can include connection text.
          DEPLOYED_SHA=$(printf '%s' "$RESPONSE" | jq -r '.checks.build.detail // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "Web deployed SHA: $DEPLOYED_SHA"
          # Auth check: /api/health makes a real Clerk backend call (not just
          # "is CLERK_SECRET_KEY set") — see docs/qa/production-login-recovery-20260902.md,
          # where a present-but-invalid key passed every presence check while
          # sign-in was completely broken. Surface it here so this scheduled
          # gate catches a reverted/invalid production secret within 30
          # minutes instead of waiting for a user report.
          AUTH_STATUS=$(printf '%s' "$RESPONSE" | jq -r '.checks.auth.status // "unknown"')
          AUTH_DETAIL=$(printf '%s' "$RESPONSE" | jq -r '.checks.auth.detail // ""' | sed -E \
            -e 's/(sk|pk)_(live|test)_[A-Za-z0-9]+/[redacted]/g' \
            -e 's/[Bb]earer[[:space:]]+[A-Za-z0-9._~+/-]+/Bearer [redacted]/g' \
            -e 's/([Tt]oken|[Ss]ecret|[Kk]ey)=[^[:space:]&]+/\1=[redacted]/g')
          echo "auth_status=$AUTH_STATUS" >> "$GITHUB_OUTPUT"
          echo "auth_detail=$AUTH_DETAIL" >> "$GITHUB_OUTPUT"
          echo "Web Clerk auth check: $AUTH_STATUS ${AUTH_DETAIL:+($AUTH_DETAIL)}"

      - name: Check terminal-server health endpoint
        id: terminal
        run: |
          RESPONSE=$(curl -sSf --max-time 10 \
            "https://litlabs-terminal-server-production-0be1.up.railway.app/health" \
            || echo '{"status":"unreachable"}')
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.commit // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> $GITHUB_OUTPUT
          echo "Terminal deployed SHA: $DEPLOYED_SHA"

      - name: Compare SHAs
        run: |
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          SOURCE_SHORT="${SOURCE_SHA:0:8}"
          WEB_SHA="${{ steps.web.outputs.deployed_sha }}"
          TERMINAL_SHA="${{ steps.terminal.outputs.deployed_sha }}"
          AUTH_STATUS="${{ steps.web.outputs.auth_status }}"
          AUTH_DETAIL="${{ steps.web.outputs.auth_detail }}"

          echo "Source:  $SOURCE_SHORT"
          echo "Web:     $WEB_SHA"
          echo "Terminal: $TERMINAL_SHA"
          echo "Auth:    $AUTH_STATUS"

          FAIL=0

          if [ "$AUTH_STATUS" = "unknown" ]; then
            echo "⚠️  Web health endpoint did not report a Clerk auth check (got: unknown) — this build predates the check, not a failure by itself"
          elif [ "$AUTH_STATUS" != "ok" ]; then
            echo "❌ Clerk auth check failed: $AUTH_STATUS — ${AUTH_DETAIL:-no detail}"
            FAIL=1
          else
            echo "✅ Clerk backend accepted the production secret key"
          fi

          if [ "$WEB_SHA" = "unknown" ] || [ "$WEB_SHA" = "dev" ]; then
            echo "⚠️  Web health endpoint did not report a real SHA (got: $WEB_SHA)"
            FAIL=1
          elif [ "$WEB_SHA" != "$SOURCE_SHORT" ]; then
            echo "❌ Web SHA mismatch: source=$SOURCE_SHORT deployed=$WEB_SHA"
            FAIL=1
          else
            echo "✅ Web SHA matches source"
          fi

          if [ "$TERMINAL_SHA" = "unknown" ] || [ "$TERMINAL_SHA" = "dev" ]; then
            echo "⚠️  Terminal health endpoint did not report a real SHA (got: $TERMINAL_SHA)"
            FAIL=1
          elif [ "$TERMINAL_SHA" != "$SOURCE_SHORT" ]; then
            echo "❌ Terminal SHA mismatch: source=$SOURCE_SHORT deployed=$TERMINAL_SHA"
            FAIL=1
          else
            echo "✅ Terminal SHA matches source"
          fi

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Release gate FAILED — deployed services are out of sync with source."
            exit 1
          fi

          echo ""
          echo "Release gate PASSED — all services report the source SHA."
