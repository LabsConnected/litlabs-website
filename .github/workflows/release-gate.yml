name: Release Gate

on:
  workflow_dispatch:
  schedule:
    # Hourly — verify deployed SHAs match source and Clerk auth is healthy.
    # (Was every 30 minutes; production-only monitor, never runs per-PR.)
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  verify-deployment-sha:
    name: Verify Deployed SHA Matches Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required: the parity check resolves the last
          # commit that touched terminal-deploy paths and runs merge-base
          # ancestry + rev-list lag checks against the deployed SHAs.
          fetch-depth: 0

      - name: Get source SHA
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          # The terminal service deploys MANUALLY (deploy-terminal.yml has
          # no push trigger under the production hold). Its legitimately
          # expected deployed SHA is the newest commit touching the
          # terminal-deploy paths — not HEAD — so unrelated merges don't
          # produce false drift.
          TERMINAL_EXPECTED=$(git log -1 --format=%H -- terminal-server docker/Dockerfile.terminal pnpm-workspace.yaml .github/workflows/deploy-terminal.yml)
          if [ -z "$TERMINAL_EXPECTED" ]; then TERMINAL_EXPECTED=$(git rev-parse HEAD); fi
          echo "terminal_expected=$TERMINAL_EXPECTED" >> $GITHUB_OUTPUT

      - name: Check web health endpoint
        id: web
        run: |
          RESPONSE=$(curl -sSf --max-time 10 \
            "https://www.litlabs.net/api/health" || echo '{"status":"unreachable"}')
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.checks.build.detail // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> $GITHUB_OUTPUT
          echo "Web deployed SHA: $DEPLOYED_SHA"
          # Auth check: /api/health makes a real Clerk backend call (not just
          # "is CLERK_SECRET_KEY set") — see docs/qa/production-login-recovery-20260902.md,
          # where a present-but-invalid key passed every presence check while
          # sign-in was completely broken. Surface it here so this scheduled
          # gate catches a reverted/invalid production secret within about an
          # hour (hourly schedule) instead of waiting for a user report.
          AUTH_STATUS=$(echo "$RESPONSE" | jq -r '.checks.auth.status // "unknown"')
          AUTH_DETAIL=$(echo "$RESPONSE" | jq -r '.checks.auth.detail // ""')
          echo "auth_status=$AUTH_STATUS" >> $GITHUB_OUTPUT
          echo "auth_detail=$AUTH_DETAIL" >> $GITHUB_OUTPUT
          echo "Web Clerk auth check: $AUTH_STATUS ${AUTH_DETAIL:+($AUTH_DETAIL)}"

      - name: Check terminal-server health endpoint
        id: terminal
        env:
          # Optional repo variable; defaults to the production terminal service.
          TERMINAL_BASE_URL: ${{ vars.TERMINAL_BASE_URL || 'https://litlabs-terminal-server-production-0be1.up.railway.app' }}
        run: |
          RESPONSE=$(curl -sSf --max-time 10 \
            "${TERMINAL_BASE_URL%/}/health" \
            || echo '{"status":"unreachable"}')
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.commit // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> $GITHUB_OUTPUT
          echo "Terminal deployed SHA: $DEPLOYED_SHA"

      - name: Compare SHAs
        run: |
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          SOURCE_SHORT="${SOURCE_SHA:0:8}"
          WEB_SHA="${{ steps.web.outputs.deployed_sha }}"
          TERMINAL_SHA="${{ steps.terminal.outputs.deployed_sha }}"
          AUTH_STATUS="${{ steps.web.outputs.auth_status }}"
          AUTH_DETAIL="${{ steps.web.outputs.auth_detail }}"

          echo "Source:  $SOURCE_SHORT"
          echo "Web:     $WEB_SHA"
          echo "Terminal: $TERMINAL_SHA"
          echo "Auth:    $AUTH_STATUS"

          FAIL=0

          if [ "$AUTH_STATUS" = "unknown" ]; then
            echo "⚠️  Web health endpoint did not report a Clerk auth check (got: unknown) — this build predates the check, not a failure by itself"
          elif [ "$AUTH_STATUS" != "ok" ]; then
            echo "❌ Clerk auth check failed: $AUTH_STATUS — ${AUTH_DETAIL:-no detail}"
            FAIL=1
          else
            echo "✅ Clerk backend accepted the production secret key"
          fi

          # Parity is checked by scripts/ci/check-deployed-sha.mjs so the
          # exact logic is unit-testable (tests/release-gate-deployed-sha).
          # Web deploys automatically — a deployed SHA that is a recent
          # ancestor of HEAD is a legitimate mid-rollout transition
          # (replicas drain at different times; run 41955317232 sampled
          # web=ccaa4cec while source+terminal were already at 289fddde),
          # while a non-ancestor, absent, unknown, or beyond-window SHA
          # remains a real failure.
          node scripts/ci/check-deployed-sha.mjs \
            --service "Web" \
            --deployed "$WEB_SHA" \
            --expect "$SOURCE_SHA" \
            --mode auto \
            --lag "${DEPLOY_LAG_TOLERANCE:-10}" || FAIL=1

          # Terminal deploys manually — tracked drift from the last
          # terminal-path commit is reported, only untracked/foreign/
          # unreachable deployments fail the gate.
          node scripts/ci/check-deployed-sha.mjs \
            --service "Terminal" \
            --deployed "$TERMINAL_SHA" \
            --expect "${{ steps.source.outputs.terminal_expected }}" \
            --mode manual || FAIL=1

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Release gate FAILED — see failing checks above."
            exit 1
          fi

          echo ""
          echo "Release gate PASSED — all services report tracked deployments."
