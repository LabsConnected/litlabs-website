name: Release Gate

on:
  workflow_dispatch:
  schedule:
    # Hourly — verify EVERY production web + terminal deployment reports the source SHA and Clerk auth is healthy.
    # Targets: www.litlabs.net (litt-shell), app.litlabs.net (web-app), terminal.litlabs.net (litlabs-terminal-server),
    # terminal-server-production-68ac (website-project terminal-server, used server-side by litt-shell).
    # (Was every 30 minutes; production-only monitor, never runs per-PR.)
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  verify-deployment-sha:
    name: Verify Deployed SHA Matches Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check web health endpoint
        id: web
        run: |
          RESPONSE=$(curl -sSf --max-time 10 \
            "https://www.litlabs.net/api/health" || echo '{"status":"unreachable"}')
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.checks.build.detail // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> $GITHUB_OUTPUT
          echo "Web deployed SHA: $DEPLOYED_SHA"
          # Auth check: /api/health makes a real Clerk backend call (not just
          # "is CLERK_SECRET_KEY set") — see docs/qa/production-login-recovery-20260902.md,
          # where a present-but-invalid key passed every presence check while
          # sign-in was completely broken. Surface it here so this scheduled
          # gate catches a reverted/invalid production secret within about an
          # hour (hourly schedule) instead of waiting for a user report.
          AUTH_STATUS=$(echo "$RESPONSE" | jq -r '.checks.auth.status // "unknown"')
          AUTH_DETAIL=$(echo "$RESPONSE" | jq -r '.checks.auth.detail // ""')
          echo "auth_status=$AUTH_STATUS" >> $GITHUB_OUTPUT
          echo "auth_detail=$AUTH_DETAIL" >> $GITHUB_OUTPUT
          echo "Web Clerk auth check: $AUTH_STATUS ${AUTH_DETAIL:+($AUTH_DETAIL)}"

      - name: Check app.litlabs.net (web-app) health endpoint
        id: app
        run: |
          RESPONSE=$(curl -sSf --max-time 10 "https://app.litlabs.net/api/health" || echo '{"status":"unreachable"}')
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.checks.build.detail // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> $GITHUB_OUTPUT
          echo "App deployed SHA: $DEPLOYED_SHA"

      - name: Check terminal-server health endpoints (both production deployments)
        id: terminal
        env:
          # terminal project: litlabs-terminal-server (browser WS/HTTP, terminal.litlabs.net)
          TERMINAL_BASE_URL: ${{ vars.TERMINAL_BASE_URL || 'https://litlabs-terminal-server-production-0be1.up.railway.app' }}
          # website project: terminal-server (server-side TERMINAL_SERVER_URL used by litt-shell)
          TERMINAL_INTERNAL_BASE_URL: ${{ vars.TERMINAL_INTERNAL_BASE_URL || 'https://terminal-server-production-68ac.up.railway.app' }}
        run: |
          RESPONSE=$(curl -sSf --max-time 10 "${TERMINAL_BASE_URL%/}/health" || echo '{"status":"unreachable"}')
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.commit // "unknown"')
          echo "deployed_sha=$DEPLOYED_SHA" >> $GITHUB_OUTPUT
          echo "Terminal (terminal project) deployed SHA: $DEPLOYED_SHA"
          RESPONSE2=$(curl -sSf --max-time 10 "${TERMINAL_INTERNAL_BASE_URL%/}/health" || echo '{"status":"unreachable"}')
          DEPLOYED_SHA2=$(echo "$RESPONSE2" | jq -r '.commit // "unknown"')
          echo "deployed_sha_internal=$DEPLOYED_SHA2" >> $GITHUB_OUTPUT
          echo "Terminal (website project) deployed SHA: $DEPLOYED_SHA2"

      - name: Compare SHAs
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.deployed_sha }}
          APP_SHA: ${{ steps.app.outputs.deployed_sha }}
          TERMINAL_SHA: ${{ steps.terminal.outputs.deployed_sha }}
          TERMINAL_INTERNAL_SHA: ${{ steps.terminal.outputs.deployed_sha_internal }}
          AUTH_STATUS: ${{ steps.web.outputs.auth_status }}
          AUTH_DETAIL: ${{ steps.web.outputs.auth_detail }}
        run: |
          SOURCE_SHORT="${SOURCE_SHA:0:8}"
          echo "Source:            $SOURCE_SHORT"
          echo "Web (www):         ${WEB_SHA:0:8}"
          echo "Web (app):         ${APP_SHA:0:8}"
          echo "Terminal (term.):  ${TERMINAL_SHA:0:8}"
          echo "Terminal (site):   ${TERMINAL_INTERNAL_SHA:0:8}"
          echo "Auth:              $AUTH_STATUS"

          FAIL=0

          if [ "$AUTH_STATUS" = "unknown" ]; then
            echo "⚠️  Web health endpoint did not report a Clerk auth check (got: unknown) — this build predates the check, not a failure by itself"
          elif [ "$AUTH_STATUS" != "ok" ]; then
            echo "❌ Clerk auth check failed: $AUTH_STATUS — ${AUTH_DETAIL:-no detail}"
            FAIL=1
          else
            echo "✅ Clerk backend accepted the production secret key"
          fi

          # Health endpoints may report the 8-char short SHA or (since #670) the full
          # 40-char Railway SHA. Compare the first 8 characters of both so a correct
          # deployment can never fail purely on format.
          check_sha() {
            label="$1"; deployed="$2"
            if [ -z "$deployed" ] || [ "$deployed" = "unknown" ] || [ "$deployed" = "dev" ]; then
              echo "❌ $label did not report a real SHA (got: ${deployed:-empty})"
              FAIL=1
            elif [ "${deployed:0:8}" != "$SOURCE_SHORT" ]; then
              echo "❌ $label SHA mismatch: source=$SOURCE_SHORT deployed=${deployed:0:8}"
              FAIL=1
            else
              echo "✅ $label SHA matches source"
            fi
          }
          check_sha "Web (www.litlabs.net)" "$WEB_SHA"
          check_sha "Web (app.litlabs.net)" "$APP_SHA"
          check_sha "Terminal (terminal.litlabs.net)" "$TERMINAL_SHA"
          check_sha "Terminal (website-project terminal-server)" "$TERMINAL_INTERNAL_SHA"

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Release gate FAILED — deployed services are out of sync with source."
            exit 1
          fi

          echo ""
          echo "Release gate PASSED — all services report the source SHA."
