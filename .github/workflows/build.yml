name: Build and Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Build @litt/agent-core
        run: pnpm --filter @litt/agent-core build
        env:
          CI: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Terminal server build
        run: pnpm --filter terminal-server build
        env:
          CI: true

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Playwright core tests (blocking)
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm exec playwright test \
            --project=public-chromium \
            --project=public-firefox \
            --project=public-webkit \
            --project=accessibility-chromium
        env:
          CI: true
          PLAYWRIGHT_TEST: true
          PLAYWRIGHT_AUTH_DISABLED: true
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Playwright visual regression (non-blocking)
        run: |
          pnpm exec playwright test --project=visual-regression || true
        env:
          CI: true
          PLAYWRIGHT_TEST: true
          PLAYWRIGHT_AUTH_DISABLED: true
          PLAYWRIGHT_VISUAL: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        continue-on-error: true

      - name: Playwright integration tests (non-blocking without terminal-server)
        run: |
          pnpm exec playwright test --project=self-contained-auth || true
        env:
          CI: true
          PLAYWRIGHT_TEST: true
          PLAYWRIGHT_AUTH_DISABLED: true
          PLAYWRIGHT_INTEGRATION: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        continue-on-error: true

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
