name: Build and Type Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Playwright tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
        env:
          CI: true
          PLAYWRIGHT_TEST: true
          # When test user secrets are available, authenticated integration
          # tests run automatically (see playwright.config.ts). When they're
          # not available, only credential-free smoke tests run.
          PLAYWRIGHT_AUTH_DISABLED: ${{ !env.CLERK_TEST_USER_A_EMAIL }}
          CLERK_TEST_USER_A_EMAIL: ${{ secrets.CLERK_TEST_USER_A_EMAIL }}
          CLERK_TEST_USER_A_PASSWORD: ${{ secrets.CLERK_TEST_USER_A_PASSWORD }}
          CLERK_TEST_USER_B_EMAIL: ${{ secrets.CLERK_TEST_USER_B_EMAIL }}
          CLERK_TEST_USER_B_PASSWORD: ${{ secrets.CLERK_TEST_USER_B_PASSWORD }}

      - name: Terminal server type check
        run: pnpm --filter terminal-server build
        env:
          CI: true

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
