<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Emulator Session</title>
  <style>
    html, body, #game {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #020204;
      overflow: hidden;
    }
    body { font-family: system-ui, sans-serif; }
    /* Force the EmulatorJS canvas to fill its container.
       Without this, the canvas may render at 0x0 or incorrect
       dimensions, causing a black screen even though the game
       is running (WebGL is drawing to the canvas). */
    #game canvas,
    #game > div > canvas,
    #game > div > div > canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* EmulatorJS creates a wrapper div — make sure it fills #game */
    #game > div {
      width: 100% !important;
      height: 100% !important;
    }

    /* Keep EmulatorJS controls in a dedicated bottom dock. The stock runtime
       positions this menu over the canvas, which hides game UI and makes the
       controls look vertically misplaced on laptop-sized screens. */
    #game .ejs_canvas_parent {
      height: calc(100% - 52px) !important;
    }
    #game .ejs_big_screen .ejs_menu_bar {
      min-height: 52px;
      box-sizing: border-box;
      padding: 8px 10px;
      background: rgba(3, 4, 9, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    #game .ejs_big_screen .ejs_menu_bar_hidden {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    @media (max-width: 640px) {
      #game .ejs_canvas_parent {
        height: 100% !important;
      }
    }

    /* ─── Save state / popup positioning fixes ─────────────────── */
    /* EmulatorJS .ejs_popup_container defaults to position:absolute; top:0
       with a very tall .ejs_popup_body, causing the save/load dialog to
       appear at the very top of the iframe instead of centered. */
    .ejs_popup_container {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      z-index: 99999 !important;
    }
    .ejs_popup_container_box {
      position: relative !important;
      max-width: 90% !important;
      max-height: 80% !important;
      width: auto !important;
      border-radius: 12px;
    }
    .ejs_popup_body {
      height: auto !important;
      max-height: 50vh !important;
      overflow: auto !important;
      padding: 10px !important;
    }
    .ejs_popup_container h4 {
      padding-top: 10px !important;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Click anywhere in the iframe to focus the window — this ensures
    // gamepad and keyboard events are routed to the iframe, not the parent.
    document.addEventListener("click", function () {
      try { window.focus(); } catch (e) {}
    });

    // ─── Keyboard input fix ──────────────────────────────────────
    // Prevent the browser from intercepting game-related keys (arrow keys,
    // space, etc.) for scrolling. Without this, arrow keys scroll the
    // parent page instead of reaching the emulator core.
    var GAME_KEYS = [
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      " ", "Spacebar",
      "Enter", "Shift", "Tab",
      "z", "x", "a", "s", "q", "w", "c",
      "Z", "X", "A", "S", "Q", "W", "C",
    ];
    document.addEventListener("keydown", function (e) {
      // Always focus the iframe window on any keydown
      try { window.focus(); } catch (err) {}
      // Prevent default for game keys to stop page scroll
      if (GAME_KEYS.indexOf(e.key) !== -1) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true); // capture phase — catch before EmulatorJS

    // Also prevent default for game keys on keyup (some browsers scroll on keyup)
    document.addEventListener("keyup", function (e) {
      if (GAME_KEYS.indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    }, true);
  </script>

  <!--
    EmulatorJS 4.2.3 isolated runtime host.

    The parent window injects configuration via URL parameters:
      ?core=nes          — EJS_core (e.g. "nes" resolves to fceumm, or "nestopia")
      &rom=<blob:url>    — EJS_gameUrl (blob URL created by parent)
      &name=<string>     — EJS_gameName
      &dataPath=<url>    — EJS_pathtodata (default: /emulatorjs/4.2.3/data/)
      &cdnTest=1         — use official CDN for diagnostic control test
      &color=<hex>       — EJS_color (accent color)
      &legacy=1          — force legacy cores (EJS_forceLegacyCores = true)
      &controlScheme=<id> — EJS_controlScheme override (e.g. "segaMD").
                            REQUIRED for Sega Genesis: the raw core
                            "genesis_plus_gx" is ambiguous — EmulatorJS's
                            getCore(true) reverse-maps it to "segaMS" (declared
                            before "segaMD" in getCores()), which renders
                            generic "BUTTON 1 / START" / "BUTTON 2" labels.
                            Passing controlScheme=segaMD forces the correct
                            Mega Drive layout (A/B/C/Start/D-Pad) while still
                            loading the genesis_plus_gx core.

    The parent listens for postMessage events from this iframe.
    All events use { source: "arcade", type: "runtime.*" } format.

    REAL signals (authoritative):
      runtime.booting          — iframe script started
      runtime.loader_loaded    — loader.js fetched successfully
      runtime.loader_ready     — EJS_ready fired (UI loaded, NOT game started)
      runtime.canvas_created   — a <canvas> element appeared inside #game
      runtime.first_frame      — canvas has non-zero dimensions (first frame rendered)
      runtime.running          — EJS_onGameStart fired (game actually started)
      runtime.error            — window error or loader error
      runtime.exited           — shutdown command processed
      runtime.heartbeat        — periodic heartbeat (every 5s)

    SUPPLEMENTARY signals (for display + watchdog reset only, NOT for state truth):
      runtime.progress              — loading text changed (e.g. "Download Game Core 42%")
      runtime.core_download_started — inferred from "Download Game Core" text
      runtime.core_download_progress— inferred from download percentage
      runtime.core_decompression_started — inferred from "Decompress Game Core" text
      runtime.core_decompression_progress — inferred from decompression percentage

    IMPORTANT: "Decompress Game Core 99%" does NOT mean decompression is complete.
    The only authoritative "done" signal is EJS_ready (UI loaded) followed by
    EJS_onGameStart (game running). The 99% text is never used as a state
    transition — it is forwarded as supplementary progress only.
  -->
  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var core = params.get("core") || "nes";
      var rom = params.get("rom") || "";
      var name = params.get("name") || "Game";
      var dataPath = params.get("dataPath") || "/emulatorjs/4.2.3/data/";
      var cdnTest = params.get("cdnTest") === "1";
      var color = params.get("color") || "#6366f1";
      var legacy = params.get("legacy") === "1";
      var bios = params.get("bios") || "";
      // controlScheme is the EmulatorJS system alias used for the Control
      // Settings menu + virtual gamepad layout. It is DISTINCT from `core`
      // (the libretro core that runs the game). See the header comment for
      // why this is mandatory for Sega Genesis.
      var controlScheme = params.get("controlScheme") || "";

      if (cdnTest) {
        dataPath = "https://cdn.emulatorjs.org/4.2.3/data/";
      }

      // ─── Post message helper ───────────────────────────────────
      function send(type, data) {
        try {
          parent.postMessage(Object.assign({ source: "arcade", type: type }, data || {}), "*");
        } catch (e) { /* parent may be gone */ }
      }

      send("runtime.booting", { core: core, dataPath: dataPath, legacy: legacy });

      // ─── EmulatorJS configuration ──────────────────────────────
      window.EJS_player = "#game";
      window.EJS_core = core;
      window.EJS_gameUrl = rom;
      window.EJS_gameName = name;
      window.EJS_gameID = Math.abs(name.split("").reduce(function (h, c) {
        h = ((h << 5) - h) + c.charCodeAt(0);
        return h | 0;
      }, 0)) || 1;
      window.EJS_pathtodata = dataPath;
      // CRITICAL: Do NOT autostart. EmulatorJS warns that
      // EJS_startOnLoaded = true may freeze until the user interacts
      // with the page. An iframe navigation does not reliably preserve
      // the original click as user activation. Let EmulatorJS show its
      // real start button — the user clicks it manually.
      window.EJS_startOnLoaded = false;
      window.EJS_startButtonName = "Start " + name;
      window.EJS_disableAutoLang = true;
      window.EJS_backgroundColor = "#020204";
      window.EJS_alignStartButton = "center";
      window.EJS_color = color;
      window.EJS_threads = false;
      window.EJS_forceLegacyCores = legacy;

      // ─── Control scheme override ───────────────────────────────
      // EmulatorJS's getControlScheme() returns config.controlScheme if set,
      // otherwise falls back to getCore(true) — which is AMBIGUOUS for Sega
      // (genesis_plus_gx reverse-maps to "segaMS" not "segaMD"). Setting
      // EJS_controlScheme explicitly forces the correct controller layout
      // (A/B/C/Start/D-Pad for segaMD) while EJS_core still loads the right
      // core. This is the supported config path — no vendored patch needed.
      if (controlScheme) {
        window.EJS_controlScheme = controlScheme;
      }

      // ─── Default controls (keyboard) ───────────────────────────
      // EJS_defaultControls is intentionally NOT injected. EmulatorJS 4.2.3's
      // setupKeys() crashes if the object format isn't exactly right (it
      // accesses this.controls[i][j] for i=0..3, j=0..29 and throws TypeError
      // if any player slot is missing or malformed). The controlScheme override
      // alone is sufficient — EmulatorJS uses its own sensible keyboard defaults
      // for each system, and users can remap via the Control Settings menu.
      // The `defaultControls` URL param is still parsed for forward compat but
      // not applied unless explicitly enabled in a future verified fix.
      var defaultControlsJson = params.get("defaultControls") || "";
      if (defaultControlsJson && params.get("enableDefaultControls") === "1") {
        try {
          window.EJS_defaultControls = JSON.parse(defaultControlsJson);
        } catch (e) {
          send("runtime.error", {
            message: "Invalid defaultControls JSON: " + e.message,
            source: "default_controls",
          });
        }
      }

      // ─── Gamepad configuration ─────────────────────────────────
      // EmulatorJS auto-detects gamepads, but Xbox One controllers
      // (and other modern gamepads) sometimes need explicit enabling
      // and a manual poll to pick up already-connected controllers.
      // The iframe must also receive focus for gamepad events to fire.
      window.EJS_gamepad = true;
      window.EJS_gamepadConnected = true;

      // ─── Control scheme — explicit mapping for Sega systems ──────
      // EmulatorJS determines the control scheme (button layout + labels)
      // by reverse-looking-up the core name to a system alias. If the
      // core name (e.g. "genesis_plus_gx") appears in multiple alias
      // groups (segaMS, segaMD, segaGG, segaCD), the FIRST match wins —
      // which is "segaMS" (Master System, 2 buttons) instead of "segaMD"
      // (Genesis, 6 buttons). This breaks Xbox/PlayStation controller
      // input on Sega games. Setting EJS_controlScheme explicitly
      // bypasses the reverse lookup and forces the correct layout.
      var CONTROL_SCHEME_MAP = {
        "segaMD": "segaMD",
        "segaCD": "segaCD",
        "sega32x": "sega32x",
        "segaMS": "segaMS",
        "segaGG": "segaGG",
        "segaSaturn": "segaSaturn",
        "genesis_plus_gx": "segaMD",
        "picodrive": "segaMD",
        "smsplus": "segaMS"
      };
      if (CONTROL_SCHEME_MAP[core]) {
        window.EJS_controlScheme = CONTROL_SCHEME_MAP[core];
      }

      // ─── Xbox One controller button map ──────────────────────
      // Standard Xbox button indices (Gamepad API):
      //   A=0, B=1, X=2, Y=3, LB=4, RB=5, LT=6, RT=7,
      //   SELECT=8, START=9, L3=10, R3=11, DPAD_UP=12,
      //   DPAD_DOWN=13, DPAD_LEFT=14, DPAD_RIGHT=15
      // Map these to EmulatorJS button labels for each console.
      // The mapping is applied per-core in EJS_ready.
      var XBOX_BUTTON_MAP = {
        // Xbox → NES
        nes: {
          "BUTTON_1": 0,   // A button
          "BUTTON_2": 2,   // B button → X
          "SELECT": 8,
          "START": 9,
          "DPAD_UP": 12,
          "DPAD_DOWN": 13,
          "DPAD_LEFT": 14,
          "DPAD_RIGHT": 15,
        },
        // Xbox → SNES
        snes: {
          "BUTTON_1": 0,   // A → A
          "BUTTON_2": 1,   // B → B
          "BUTTON_3": 2,   // X → X
          "BUTTON_4": 3,   // Y → Y
          "LEFT_TOP_SHOULDER": 4,    // L → LB
          "RIGHT_TOP_SHOULDER": 5,   // R → RB
          "SELECT": 8,
          "START": 9,
          "DPAD_UP": 12,
          "DPAD_DOWN": 13,
          "DPAD_LEFT": 14,
          "DPAD_RIGHT": 15,
        },
      };

      // Manually poll for already-connected gamepads on load.
      // The `gamepadconnected` event only fires on button press, so
      // if the controller was connected before the iframe loaded,
      // EmulatorJS may not detect it until a button is pressed.
      // This poll forces detection on startup.
      function pollGamepads() {
        var gamepadStates = [];
        try {
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (var i = 0; i < pads.length; i++) {
            if (pads[i]) {
              gamepadStates.push({
                index: pads[i].index,
                id: pads[i].id.substring(0, 60),
                buttons: pads[i].buttons.length,
                axes: pads[i].axes.length,
              });
            }
          }
        } catch (e) {
          send("runtime.progress", { text: "gamepad poll error: " + e.message });
        }
        if (gamepadStates.length > 0) {
          send("runtime.gamepad_connected", {
            count: gamepadStates.length,
            pads: gamepadStates,
          });
        } else {
          send("runtime.gamepad_disconnected");
        }
        return gamepadStates;
      }

      // ─── Continuous gamepad monitoring ────────────────────────
      // Poll every 2s to detect hotplug/unplug events. The Gamepad API
      // on some browsers stops reporting controllers after a while if
      // the iframe loses focus — this keeps it honest.
      var gamepadMonitorInterval = null;
      var lastGamepadCount = 0;

      function startGamepadMonitor() {
        if (gamepadMonitorInterval) return;
        // Initial poll
        var pads = pollGamepads();
        lastGamepadCount = pads.length;
        // Monitor every 2s
        gamepadMonitorInterval = setInterval(function () {
          var current = pollGamepads();
          // If count changed, also emit connect/disconnect events
          if (current.length !== lastGamepadCount) {
            lastGamepadCount = current.length;
            if (current.length > 0) {
              send("runtime.progress", {
                text: "gamepad hotplug: " + current.length + " controller(s) detected"
              });
            } else {
              send("runtime.progress", {
                text: "gamepad unplugged: all controllers disconnected"
              });
            }
          }
        }, 2000);
      }

      // ─── Force re-scan on user interaction ────────────────────
      // Browsers may gate navigator.getGamepads() behind user activation.
      // Every click/tap inside the iframe triggers a fresh poll.
      document.addEventListener("click", function () {
        try { window.focus(); } catch (e) {}
        // Re-scan gamepads on click
        pollGamepads();
        // If EmulatorJS exists, also refresh its internal gamepad state
        if (window.EJS_emulator && typeof window.EJS_emulator.gamepadHandler !== "undefined") {
          try { window.EJS_emulator.gamepadHandler.loop(); } catch (e) {}
        }
      });

      // Also re-scan on touch (mobile controllers, tablet)
      document.addEventListener("touchstart", function () {
        setTimeout(pollGamepads, 100);
      });

      // Poll for gamepads after the loader is ready (EJS_ready).
      // Also listen for gamepadconnected/disconnected events.
      window.addEventListener("gamepadconnected", function (e) {
        lastGamepadCount = 1;
        startGamepadMonitor();
        send("runtime.progress", {
          text: "gamepadconnected: " + (e.gamepad ? e.gamepad.id.substring(0, 60) : "unknown") +
            " (index=" + (e.gamepad ? e.gamepad.index : -1) + ")"
        });
        pollGamepads();
      });
      window.addEventListener("gamepaddisconnected", function (e) {
        lastGamepadCount = 0;
        send("runtime.progress", {
          text: "gamepaddisconnected: " + (e.gamepad ? e.gamepad.id.substring(0, 60) : "unknown")
        });
        pollGamepads();
      });

      // BIOS URL — passed from parent for Satellaview/BS-X titles
      // that require BS-X.bin. The URL is a blob: or data: URL created
      // by the parent from a user-selected file. Stays in browser only.
      if (bios) {
        window.EJS_biosUrl = bios;
      }

      // Fix file:/// security errors — EmulatorJS may try to load
      // save files or BIOS from file:// paths. Force all paths to
      // be relative to the data path (https).
      window.EJS_loadSaveURL = false;
      // Use IndexedDB for saves (not file:// paths)
      window.EJS_gameID = "litt-" + window.EJS_gameID;

      // Track real runtime milestones
      var loaderReady = false;
      var canvasCreated = false;
      var firstFrameEmitted = false;
      var runningEmitted = false;

      // ─── Runtime event hooks (REAL signals) ────────────────────
      // EJS_ready = UI loaded (NOT game started). This is the real signal
      // that the loader finished, the core was downloaded + decompressed,
      // and the EmulatorJS UI is ready for the user to click Start.
      window.EJS_ready = function () {
        loaderReady = true;
        send("runtime.loader_ready");
        // Poll for already-connected gamepads now that EmulatorJS is ready.
        // This catches controllers that were connected before the iframe loaded.
        startGamepadMonitor();

        // Apply Xbox button mapping for the current core if available
        var coreKey = (window.EJS_core || core || "").toLowerCase();
        var mapping = null;
        if (coreKey.indexOf("nes") !== -1 || coreKey.indexOf("fceumm") !== -1 || coreKey.indexOf("nestopia") !== -1) {
          mapping = XBOX_BUTTON_MAP.nes;
        } else if (coreKey.indexOf("snes") !== -1 || coreKey.indexOf("snes9x") !== -1) {
          mapping = XBOX_BUTTON_MAP.snes;
        } else if (coreKey.indexOf("gb") !== -1 || coreKey.indexOf("gambatte") !== -1 || coreKey.indexOf("mgba") !== -1) {
          // Game Boy / GBA use same layout as NES (A+B, Start+Select, D-Pad)
          mapping = XBOX_BUTTON_MAP.nes;
        } else if (coreKey.indexOf("genesis") !== -1 || coreKey.indexOf("md") !== -1) {
          // Genesis / Mega Drive uses SNES layout (A+B+C + Start + D-Pad)
          mapping = XBOX_BUTTON_MAP.snes;
        }
        // Map is used only if EmulatorJS exposes its gamepad config
        if (mapping && window.EJS_emulator && window.EJS_emulator.config) {
          try {
            window.EJS_emulator.config.gamepadMapping = mapping;
          } catch (e) {}
        }

        setTimeout(function () {
          pollGamepads();
          // On Xbox controllers, the `gamepadconnected` event may not fire until
          // a button is pressed. Do one extra poll after the UI is interactive.
        }, 1500);
      };

      // EJS_onGameStart = game actually started (canvas rendering).
      // This is the real "running" signal — NOT inferred from loading text.
      window.EJS_onGameStart = function () {
        if (!runningEmitted) {
          runningEmitted = true;
          send("runtime.running");
          // Auto-focus the iframe window so gamepad events fire here.
          // Without focus, some browsers route gamepad input to the
          // parent page instead of the iframe.
          try { window.focus(); } catch (e) {}
          // Ensure continuous gamepad monitoring is active
          startGamepadMonitor();
          // Poll again for gamepads now that the game is running.
          setTimeout(pollGamepads, 500);
        }
      };

      // EJS_onGameStart is the authoritative signal, but we also observe
      // the canvas directly for first-frame detection. This catches cases
      // where the game starts rendering before/without the start callback.
      function checkCanvas() {
        if (firstFrameEmitted) return;
        var game = document.getElementById("game");
        if (!game) return;
        // Search both inside #game AND the entire document — EmulatorJS
        // may create the canvas in a wrapper div or a different location
        var canvas = game.querySelector("canvas") || document.querySelector("canvas");
        if (!canvas) return;
        if (!canvasCreated) {
          canvasCreated = true;
          send("runtime.canvas_created", {
            width: canvas.width,
            height: canvas.height,
            parentTag: canvas.parentElement ? canvas.parentElement.tagName : "unknown",
            parentClass: canvas.parentElement ? canvas.parentElement.className : "",
          });
        }
        // First frame = canvas has non-zero dimensions
        if (canvas.width > 0 && canvas.height > 0) {
          firstFrameEmitted = true;
          send("runtime.first_frame", {
            width: canvas.width,
            height: canvas.height,
          });
        }
      }

      // Poll for canvas creation + first frame. requestAnimationFrame is
      // the most reliable way to detect when the canvas is first painted.
      function canvasWatchLoop() {
        checkCanvas();
        if (!firstFrameEmitted) {
          requestAnimationFrame(canvasWatchLoop);
        }
      }
      // Start the canvas watch once #game has children (loader injected them)
      function startCanvasWatch() {
        var root = document.getElementById("game");
        if (root && root.children.length > 0) {
          requestAnimationFrame(canvasWatchLoop);
        } else {
          setTimeout(startCanvasWatch, 100);
        }
      }
      startCanvasWatch();

      // ─── Canvas resize observer — force canvas to fill container ──
      // EmulatorJS sets canvas width/height to the game's native
      // resolution (e.g. 256x224 for NES, 512x448 for SNES) but the
      // CSS width/height may not be set, causing a black screen.
      // This observer watches for the canvas appearing and forces
      // its CSS dimensions to 100% of the container.
      var resizeObserver = new ResizeObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          var canvas = entry.target;
          if (canvas.tagName === "CANVAS") {
            // Force CSS dimensions to fill the container
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.display = "block";
            canvas.style.objectFit = "contain";
          }
        }
      });

      // Watch for canvas creation and start observing it
      var canvasObserverInterval = setInterval(function () {
        var canvas = document.querySelector("canvas");
        if (canvas) {
          resizeObserver.observe(canvas);
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          canvas.style.display = "block";
          clearInterval(canvasObserverInterval);
        }
      }, 200);

      // ─── DOM diagnostics — report what's inside #game every 2s ─────
      // This helps diagnose black screen issues by showing exactly what
      // EmulatorJS created inside the player element.
      var diagInterval = setInterval(function () {
        var game = document.getElementById("game");
        if (!game) return;
        var children = game.children.length;
        var canvas = game.querySelector("canvas") || document.querySelector("canvas");
        var canvasInfo = canvas ? {
          tag: canvas.tagName,
          width: canvas.width,
          height: canvas.height,
          cssWidth: canvas.style.width,
          cssHeight: canvas.style.height,
          parentTag: canvas.parentElement ? canvas.parentElement.tagName : "none",
          parentClass: canvas.parentElement ? canvas.parentElement.className.substring(0, 60) : "",
        } : null;
        // Check for WebGL context
        var gl = null;
        if (canvas) {
          try { gl = canvas.getContext("webgl2") || canvas.getContext("webgl") || canvas.getContext("2d"); } catch (e) {}
        }
        send("runtime.dom_diagnostics", {
          gameChildren: children,
          gameInnerHTMLLen: game.innerHTML.length,
          canvas: canvasInfo,
          contextType: gl ? (gl.constructor.name || "unknown") : null,
          bodyChildren: document.body.children.length,
        });
      }, 2000);

      // ─── Loading text observer (SUPPLEMENTARY only) ────────────
      // We observe the loading text for progress info, but the REAL
      // state transitions come from EJS_ready, canvas detection, and
      // EJS_onGameStart. The 99% text is NEVER used as a state transition.
      var lastText = "";
      var textObserver = new MutationObserver(function () {
        var el = document.querySelector(".ejs_loading_text");
        if (!el) return;
        var text = (el.innerText || "").trim();
        if (text && text !== lastText) {
          lastText = text;
          send("runtime.progress", { text: text });

          // Infer stage from text for supplementary events + watchdog reset.
          // These are NOT authoritative — the parent uses them only to
          // update the display and reset stage-specific watchdogs.
          var downloadMatch = text.match(/download.*core.*?(\d+)%/i);
          if (downloadMatch) {
            var dlPct = parseInt(downloadMatch[1], 10);
            send("runtime.core_download_progress", { percent: dlPct, text: text });
          } else if (/download.*core/i.test(text)) {
            send("runtime.core_download_started", { text: text });
          }

          var decompressMatch = text.match(/decompress.*core.*?(\d+)%/i);
          if (decompressMatch) {
            var dcPct = parseInt(decompressMatch[1], 10);
            send("runtime.core_decompression_progress", { percent: dcPct, text: text });
          } else if (/decompress.*core/i.test(text)) {
            send("runtime.core_decompression_started", { text: text });
          }
        }
      });

      function startTextObserving() {
        var root = document.getElementById("game");
        if (root) {
          textObserver.observe(root, { subtree: true, childList: true, characterData: true });
        } else {
          setTimeout(startTextObserving, 50);
        }
      }
      startTextObserving();

      // ─── Error handling ────────────────────────────────────────
      // Forward ALL errors to the parent — including worker errors,
      // console errors, and unhandled rejections. This is critical for
      // diagnosing the "Decompress Game Core 99%" stall.

      // Intercept console.error — the 7z decompression worker logs errors
      // to console.error that never surface as window error events.
      var origConsoleError = console.error.bind(console);
      console.error = function () {
        var args = Array.prototype.slice.call(arguments);
        var msg = args.map(function (a) {
          try { return typeof a === "object" ? JSON.stringify(a) : String(a); }
          catch (e) { return String(a); }
        }).join(" ");
        send("runtime.error", { message: "console.error: " + msg, source: "console" });
        origConsoleError.apply(console, args);
      };

      // Intercept console.warn — workers may warn before failing
      var origConsoleWarn = console.warn.bind(console);
      console.warn = function () {
        var args = Array.prototype.slice.call(arguments);
        var msg = args.map(function (a) {
          try { return typeof a === "object" ? JSON.stringify(a) : String(a); }
          catch (e) { return String(a); }
        }).join(" ");
        send("runtime.progress", { text: "warn: " + msg });
        origConsoleWarn.apply(console, args);
      };

      // Forward console.log for debugging
      var origConsoleLog = console.log.bind(console);
      console.log = function () {
        var args = Array.prototype.slice.call(arguments);
        var msg = args.map(function (a) {
          try { return typeof a === "object" ? JSON.stringify(a) : String(a); }
          catch (e) { return String(a); }
        }).join(" ");
        // Only forward if it looks like an emulator message
        if (/EJS|emulator|core|decompress|download|worker|wasm/i.test(msg)) {
          send("runtime.progress", { text: "log: " + msg.substring(0, 200) });
        }
        origConsoleLog.apply(console, args);
      };

      window.addEventListener("error", function (e) {
        send("runtime.error", {
          message: (e && e.message) || "emulator error",
          filename: e && e.filename,
          lineno: e && e.lineno,
          colno: e && e.colno,
          stack: (e && e.error && e.error.stack) || null,
          source: "window.error",
        });
      });

      window.addEventListener("unhandledrejection", function (e) {
        var msg = "Unhandled promise rejection";
        var stack = null;
        if (e && e.reason) {
          msg += ": " + (e.reason.message || String(e.reason));
          stack = e.reason.stack || null;
        }
        send("runtime.error", { message: msg, stack: stack, source: "unhandledrejection" });
      });

      // ─── ROM preflight validation ──────────────────────────────
      // Verify the ROM blob URL is fetchable and has non-trivial size
      // BEFORE loading loader.js. This catches revoked blob URLs and
      // empty/corrupt ROMs early, with a clear error message.
      async function preflightRom() {
        if (!rom) {
          send("runtime.error", { message: "No ROM URL provided", source: "rom_preflight" });
          return false;
        }
        try {
          var response = await fetch(rom);
          if (!response.ok) {
            send("runtime.error", {
              message: "ROM request failed: " + response.status,
              source: "rom_preflight",
            });
            return false;
          }
          var buf = await response.arrayBuffer();
          if (buf.byteLength < 512) {
            send("runtime.error", {
              message: "ROM is empty or invalid: " + buf.byteLength + " bytes",
              source: "rom_preflight",
            });
            return false;
          }
          send("runtime.rom_ready", { bytes: buf.byteLength, core: core });
          return true;
        } catch (err) {
          send("runtime.error", {
            message: "ROM preflight fetch failed: " + (err && err.message || err),
            source: "rom_preflight",
          });
          return false;
        }
      }

      // ─── Load the official loader.js (after ROM preflight) ───────
      send("runtime.preparing_runtime", { dataPath: dataPath });

      function loadLoader() {
        var script = document.createElement("script");
        script.src = dataPath + "loader.js";
        script.onload = function () {
          send("runtime.loader_loaded");
        };
        script.onerror = function () {
          send("runtime.error", {
            message: "loader.js failed to load from " + dataPath,
          });
        };
        document.head.appendChild(script);
      }

      // Run ROM preflight first, then load loader.js.
      // If preflight fails, the error is already reported — don't load.
      preflightRom().then(function (ok) {
        if (ok) loadLoader();
      });

      // ─── Heartbeat ─────────────────────────────────────────────
      // Sent every 5s so the parent can detect iframe crashes.
      var heartbeatInterval = setInterval(function () {
        send("runtime.heartbeat", { timestamp: Date.now() });
      }, 5000);

      // ─── Parent command listener ───────────────────────────────
      window.addEventListener("message", function (event) {
        if (!event.data || event.data.source !== "arcade-parent") return;
        var cmd = event.data.type;

        if (cmd === "command.start") {
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.start === "function") {
              window.EJS_emulator.start();
            }
          } catch (e) {
            send("runtime.error", { message: "start failed: " + e.message });
          }
        } else if (cmd === "command.pause") {
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.pause === "function") {
              window.EJS_emulator.pause();
              send("runtime.paused");
            }
          } catch (e) {
            send("runtime.error", { message: "pause failed: " + e.message });
          }
        } else if (cmd === "command.resume") {
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.resume === "function") {
              window.EJS_emulator.resume();
              send("runtime.running");
            }
          } catch (e) {
            send("runtime.error", { message: "resume failed: " + e.message });
          }
        } else if (cmd === "command.reset") {
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.restart === "function") {
              window.EJS_emulator.restart();
            }
          } catch (e) {
            send("runtime.error", { message: "reset failed: " + e.message });
          }
        } else if (cmd === "command.fullscreen") {
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.toggleFullscreen === "function") {
              window.EJS_emulator.toggleFullscreen();
            }
          } catch (e) {
            send("runtime.error", { message: "fullscreen failed: " + e.message });
          }
        } else if (cmd === "command.save_state") {
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.saveSaveFiles === "function") {
              window.EJS_emulator.saveSaveFiles();
            }
          } catch (e) {
            send("runtime.error", { message: "save_state failed: " + e.message });
          }
        } else if (cmd === "command.load_state") {
          // State loading is handled via the EmulatorJS UI; the command
          // is a no-op here but acknowledged so the parent can track it.
          send("runtime.progress", { text: "load_state requested (use emulator menu)" });
        } else if (cmd === "command.shutdown") {
          clearInterval(heartbeatInterval);
          textObserver.disconnect();
          try {
            if (window.EJS_emulator && typeof window.EJS_emulator.exit === "function") {
              window.EJS_emulator.exit();
            }
          } catch (e) { /* ignore */ }
          send("runtime.exited");
        }
      });
    })();
  </script>
</body>
</html>
