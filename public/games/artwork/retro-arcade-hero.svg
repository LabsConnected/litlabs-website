<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="40%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bgGrad)"/>

  <circle cx="300" cy="200" r="250" fill="url(#glow1)"/>
  <circle cx="1300" cy="400" r="300" fill="url(#glow2)"/>

  <g opacity="0.06">
    <line x1="0" y1="100" x2="1600" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1600" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1600" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="500" x2="1600" y2="500" stroke="#fff" stroke-width="1"/>
  </g>

  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="280" height="180" rx="16" fill="#0d0d18" stroke="url(#neonGrad)" stroke-width="2" filter="url(#neonGlow)"/>
    <rect x="16" y="16" width="248" height="120" rx="8" fill="#07070f"/>
    <text x="140" y="85" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700" opacity="0.4">PRESS START</text>
    <circle cx="140" cy="155" r="6" fill="#ff4d67" opacity="0.8"/>
    <rect x="20" y="150" width="40" height="8" rx="4" fill="#333"/>
    <rect x="220" y="150" width="40" height="8" rx="4" fill="#333"/>
  </g>

  <g transform="translate(1240, 80)" opacity="0.5">
    <rect x="0" y="0" width="120" height="160" rx="12" fill="#0d0d18" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <rect x="12" y="12" width="96" height="100" rx="6" fill="#07070f"/>
    <text x="60" y="70" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="8" font-weight="700" opacity="0.5">SNES</text>
    <rect x="16" y="124" width="88" height="6" rx="3" fill="#333"/>
  </g>

  <g transform="translate(1100, 350)" opacity="0.4">
    <rect x="0" y="0" width="100" height="140" rx="10" fill="#0d0d18" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <rect x="10" y="10" width="80" height="90" rx="5" fill="#07070f"/>
    <text x="50" y="60" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="7" font-weight="700" opacity="0.5">GBA</text>
    <rect x="14" y="110" width="72" height="5" rx="2.5" fill="#333"/>
  </g>

  <g transform="translate(450, 420)" opacity="0.3">
    <rect x="0" y="0" width="90" height="120" rx="8" fill="#0d0d18" stroke="#a3e635" stroke-width="1" opacity="0.5"/>
    <rect x="8" y="8" width="74" height="76" rx="4" fill="#07070f"/>
    <text x="45" y="52" text-anchor="middle" fill="#a3e635" font-family="monospace" font-size="6" font-weight="700" opacity="0.4">GB</text>
    <rect x="12" y="92" width="66" height="4" rx="2" fill="#333"/>
  </g>

  <g transform="translate(680, 100)" opacity="0.25">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#d946ef" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d946ef" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#d946ef" stroke-width="1"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#d946ef" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#d946ef" stroke-width="1" opacity="0.5"/>
  </g>

  <g transform="translate(600, 250)">
    <text x="0" y="0" fill="url(#textGrad)" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="6" filter="url(#neonGlow)">CHAPTER 01</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="900" letter-spacing="-1">LiTT Retro Arcade</text>
    <text x="0" y="110" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="400" opacity="0.5">Your private browser-powered game library</text>
  </g>

  <g transform="translate(600, 360)">
    <rect x="0" y="0" width="160" height="44" rx="12" fill="url(#neonGrad)" filter="url(#neonGlow)"/>
    <text x="80" y="29" text-anchor="middle" fill="#0a0a14" font-family="sans-serif" font-size="14" font-weight="900">OPEN ARCADE</text>
    <rect x="176" y="0" width="140" height="44" rx="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <text x="246" y="29" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700" opacity="0.7">IMPORT ROMS</text>
  </g>

  <g transform="translate(600, 430)" opacity="0.4">
    <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" letter-spacing="2">NES · SNES · GENESIS · GB · GBC · GBA</text>
  </g>

  <g transform="translate(80, 80)" opacity="0.15">
    <polygon points="0,0 30,0 15,25" fill="#22d3ee"/>
    <polygon points="40,10 70,10 55,35" fill="#d946ef"/>
    <polygon points="20,45 50,45 35,70" fill="#a855f7"/>
  </g>

  <g transform="translate(1450, 520)" opacity="0.15">
    <polygon points="0,0 30,0 15,25" fill="#d946ef"/>
    <polygon points="-40,10 -10,10 -25,35" fill="#22d3ee"/>
  </g>
</svg>
