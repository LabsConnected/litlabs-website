# Note: top-level `version` key is obsolete in Docker Compose v2 (ignored if set)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
        - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL}
        - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
    ports:
      - "3000:3000"
    environment:
      # Auth
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      # AI
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Media
      - HUGGING_FACE_API_KEY=${HUGGING_FACE_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      # DB
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Payments
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Admin
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - AUTH_SECRET=${AUTH_SECRET}
      # Misc
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/llm/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  terminal:
    build:
      context: ./terminal-server
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - TERMINAL_SERVER_PORT=4001
      - TERMINAL_ALLOWED_ORIGIN=http://localhost:3000,http://localhost:3001
      - TERMINAL_AUTH_SECRET=${TERMINAL_AUTH_SECRET}
      - TERMINAL_INTERNAL_SERVICE_KEY=${TERMINAL_INTERNAL_SERVICE_KEY}
      - TERMINAL_WORKSPACE_ROOT=/data/littree-workspaces
      - TERMINAL_USE_DOCKER=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    volumes:
      - littree-workspaces:/data/littree-workspaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  voice:
    build:
      context: ./voice-server
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - VOICE_PROXY_PORT=4002
      - INWORLD_API_KEY=${INWORLD_API_KEY}
      - VOICE_AUTH_SECRET=${VOICE_AUTH_SECRET}
      - MAX_CONCURRENT_SESSIONS_PER_USER=${MAX_CONCURRENT_SESSIONS_PER_USER:-3}
      - MAX_TOTAL_SESSIONS=${MAX_TOTAL_SESSIONS:-50}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  littree-workspaces:
