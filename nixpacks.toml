# Nixpacks config for the terminal-server Railway service.
# Railway builds from the repo root, which Nixpacks auto-detects as a Next.js
# app. We override that detection entirely and build only the terminal-server.
#
# The terminal-server uses node-pty (native module) which requires Python 3
# and build tools to compile.

# Override auto-detected providers — don't run the Next.js provider
providers = []

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake", "bash", "git", "curl"]
aptPkgs = ["python3", "make", "g++", "bash", "git", "curl"]

[phases.install]
cmds = [
  "cd terminal-server && npm install --legacy-peer-deps"
]

[phases.build]
cmds = [
  "cd terminal-server && npm run build"
]

[start]
cmd = "cd terminal-server && node dist/server.js"
